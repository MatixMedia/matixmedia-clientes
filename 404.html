<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MatixMedia · Página no encontrada</title>
<script>
/*
  Carpetas de cliente renombradas. Si alguien abre un link viejo, se le envía
  a la ruta nueva conservando el resto de la ruta, los parámetros y el ancla.
  Para agregar un renombre: "ruta vieja": "ruta nueva" (sin codificar espacios).
*/
var CARPETAS_RENOMBRADAS = {
  "/clientes/HUA-Naturals/": "/clientes/HUA NATURALS/"
};

(function () {
  var ruta = decodeURIComponent(location.pathname);
  for (var vieja in CARPETAS_RENOMBRADAS) {
    if (ruta.indexOf(vieja) === 0) {
      var nueva = CARPETAS_RENOMBRADAS[vieja] + ruta.slice(vieja.length);
      location.replace(encodeURI(nueva) + location.search + location.hash);
      return;
    }
  }
})();
</script>

  :root { --bg:#0f1115; --fg:#e8eaed; --muted:#9aa0a6; --accent:#14b8a6; }

  h1 { font-size:20px; margin:0 0 8px; }
  p { color:var(--muted); line-height:1.5; margin:0 0 16px; }
  a { color:var(--accent); }
</style>
</head>

  </div>
</body>
