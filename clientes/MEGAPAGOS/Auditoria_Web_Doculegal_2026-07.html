<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MatixMedia · Auditoría Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04050A;--bg-2:#0C0D13;--bg-3:#14151C;
  --accent:#E8C046;
  --teal:#199477;--teal-dim:rgba(25,148,119,.15);
  --red:#CF343A;--red-dim:rgba(207,52,58,.15);
  --amber:#D97C10;--amber-dim:rgba(217,124,16,.15);
  --ink:#FDFCF7;--ink-dim:#A8A598;--line:#1E1F28;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg-2)}::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}

/* WRAP */
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}

/* HEADER — igual al informe */
.report-header{background:var(--bg-2);border-bottom:1px solid var(--line);padding:24px 0;position:sticky;top:0;z-index:100}
.report-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.header-left{display:flex;align-items:center;gap:14px}
.logo-circle{width:48px;height:48px;border-radius:50%;overflow:hidden;border:2px solid var(--accent);flex-shrink:0}
.logo-circle img{width:100%;height:100%;object-fit:contain;padding:2px}
.header-title{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--ink-dim);margin-bottom:3px;font-family:var(--mono)}
.header-client{font-size:20px;font-weight:600;color:var(--ink)}
.header-period{font-size:11px;color:var(--ink-dim);font-family:var(--mono)}
.header-right{text-align:right}
.header-url{font-size:12px;color:var(--accent);font-family:var(--mono)}
.header-date{font-size:11px;color:var(--ink-dim);margin-top:3px}

/* HERO */
.hero{padding:32px 0;background:linear-gradient(160deg,var(--bg-3) 0%,var(--bg) 100%);border-bottom:1px solid var(--line)}
.hero-title{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--ink-dim);margin-bottom:20px;font-family:var(--mono)}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
.kpi-card{background:var(--bg-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:14px 16px;transition:.2s}
.kpi-card:hover{background:#0F1018}
.kpi-label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-dim);margin-bottom:6px;font-family:var(--mono)}
.kpi-value{font-size:34px;font-weight:700;line-height:1;font-family:var(--mono)}
.kpi-sub{font-size:10px;color:var(--ink-dim);margin-top:5px}
.kpi-card.ok{border-left-color:var(--teal)}.kpi-card.ok .kpi-value{color:var(--teal)}
.kpi-card.bad{border-left-color:var(--red)}.kpi-card.bad .kpi-value{color:var(--red)}
.kpi-card.warn{border-left-color:var(--amber)}.kpi-card.warn .kpi-value{color:var(--amber)}

/* MAIN */
.main{padding:32px 0}
.section{padding:28px 0;border-top:1px solid var(--line)}
.section:first-child{border-top:none;padding-top:0}
.section-header{display:flex;align-items:baseline;gap:10px;margin-bottom:18px}
.section-num{font-family:var(--mono);font-size:10px;color:var(--accent);font-weight:600;letter-spacing:.1em}
.section-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.section-title.bad{color:var(--red)}.section-title.warn{color:var(--amber)}.section-title.ok{color:var(--teal)}.section-title.def{color:var(--ink)}

/* ITEMS */
.items{display:flex;flex-direction:column;gap:10px}
.item{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:start;transition:.15s}
.item:hover{background:var(--bg-3)}
.item.bad{border-left:3px solid var(--red)}
.item.warn{border-left:3px solid var(--amber)}
.item.ok{border-left:3px solid var(--teal)}
.item-icon{font-size:15px;line-height:1.5;text-align:center}
.item-title{font-size:13px;font-weight:600;margin-bottom:4px}
.item.bad .item-title{color:var(--red)}.item.warn .item-title{color:var(--amber)}.item.ok .item-title{color:var(--teal)}
.item-desc{font-size:12px;color:var(--ink-dim);line-height:1.55}
.item-code{font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 12px;margin-top:10px;color:var(--ink);line-height:1.6}
.item-fix{font-size:11px;color:var(--accent);margin-top:7px;font-weight:600}
.badge{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:3px;white-space:nowrap;align-self:start;margin-top:3px;font-family:var(--mono)}
.badge.critico{background:var(--red-dim);color:var(--red);border:1px solid rgba(207,52,58,.3)}
.badge.mejora{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(217,124,16,.3)}
.badge.ok{background:var(--teal-dim);color:var(--teal);border:1px solid rgba(25,148,119,.3)}

/* TABLE */
.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--line)}
.priority-table{width:100%;border-collapse:collapse;font-size:12px}
.priority-table th{text-align:left;padding:10px 14px;background:var(--bg-3);color:var(--ink-dim);font-size:9px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line);font-family:var(--mono)}
.priority-table td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.priority-table tr:last-child td{border-bottom:none}
.priority-table tr:hover td{background:var(--bg-3)}
.p1{color:var(--red);font-weight:700;font-family:var(--mono);font-size:11px}
.p2{color:var(--amber);font-weight:700;font-family:var(--mono);font-size:11px}
.p3{color:var(--teal);font-weight:700;font-family:var(--mono);font-size:11px}
.td-impact{color:var(--ink-dim);font-size:11px}
.td-time{color:var(--accent);font-family:var(--mono);font-size:11px;white-space:nowrap}

/* FOOTER — igual al informe */
.report-footer{border-top:1px solid var(--line);padding:24px 0;margin-top:32px}
.footer-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
.footer-brand{display:flex;align-items:center;gap:10px}
.footer-logo{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid var(--accent)}
.footer-logo img{width:100%;height:100%;object-fit:contain;padding:2px}
.footer-name{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600}
.footer-sub{font-size:9px;color:var(--ink-dim)}
.footer-date{font-family:var(--mono);font-size:9px;color:var(--ink-dim);margin-top:2px}
.footer-links{display:flex;align-items:center;gap:8px}
.footer-social{width:30px;height:30px;border-radius:50%;background:var(--bg-3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:.2s;cursor:pointer}
.footer-social:hover{background:var(--accent);border-color:var(--accent)}
.footer-social:hover svg{fill:var(--bg)}
.footer-social svg{width:14px;height:14px;fill:var(--ink-dim);transition:.2s}
.footer-wa{display:flex;align-items:center;gap:7px;background:#25D366;color:#fff;font-family:var(--mono);font-size:10px;font-weight:600;padding:7px 12px;border-radius:18px;cursor:pointer;border:none;text-decoration:none;animation:wa-shake 10s infinite}
.footer-wa svg{width:14px;height:14px;fill:#fff;flex-shrink:0}
@keyframes wa-shake{0%,85%,100%{transform:none}87%{transform:rotate(-12deg)}89%{transform:rotate(12deg)}91%{transform:rotate(-8deg)}93%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}97%{transform:rotate(0)}}
.footer-social{width:30px;height:30px;border-radius:50%;background:var(--bg-3);border:1px

/* RESPONSIVE MOBILE */
@media(max-width:640px){
  body{overflow-x:hidden}

  /* HEADER MOBILE — todo en bloque centrado */
  .report-header .wrap{
    display:block;
    padding:16px;
    text-align:center;
  }
  .header-left{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:12px;
  }
  .header-left > div{
    text-align:center;
    width:100%;
  }
  .header-title,.header-client,.header-period{
    text-align:center;
    display:block;
  }
  .header-right{
    display:block;
    text-align:center !important;
    width:100%;
  }
  .header-url,.header-date{
    text-align:center;
    display:block;
  }

  /* HERO Y MAIN */
  .hero .wrap,.main .wrap,.report-footer .wrap{padding:0 16px}
  .kpi-grid{grid-template-columns:1fr 1fr;gap:8px}
  .item{grid-template-columns:24px 1fr}
  .item .badge{display:none}

  /* FOOTER MOBILE — todo en bloque centrado */
  .report-footer .wrap{padding:0 16px}
  .footer-inner{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:16px;
    width:100%;
  }
  .footer-brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
  }
  .footer-brand > div{
    text-align:center;
    width:100%;
  }
  .footer-name,.footer-sub,.footer-date,.footer-name a{
    text-align:center;
    display:block;
    width:100%;
  }
  .footer-right{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    width:100%;
  }
  .footer-links{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    width:100%;
  }

  /* TABLA */
  .priority-table th:nth-child(3),.priority-table td:nth-child(3),
  .priority-table th:nth-child(5),.priority-table td:nth-child(5){display:none}
}
</style>
</head>

function render() {
  var W = WDATA;
  var ag = W.agency;
  var sc = W.scores;
  var now = new Date();
  var dateStr = now.toLocaleDateString('es-CO', {weekday:'long',year:'numeric',month:'long',day:'numeric'});
  var scoreColor = sc.total >= 80 ? 'ok' : sc.total >= 60 ? 'warn' : 'bad';
  var scoreLabel = sc.total >= 80 ? 'Bueno' : sc.total >= 60 ? 'Mejorable' : 'Critico';

  var kpiHTML = [
    {label:'Score General',        value:sc.total,    sub:'/ 100 — '+scoreLabel, cls:scoreColor},
    {label:'Issues Criticos',      value:sc.criticos, sub:'Riesgo Google Ads',         cls:'bad'},
    {label:'Mejoras Importantes',  value:sc.mejoras,  sub:'Impacto en conversion',     cls:'warn'},
    {label:'Cumple Correctamente', value:sc.ok,       sub:'Mantener y reforzar',       cls:'ok'}
  ].map(function(k){
    return '<div class="kpi-card '+k.cls+'">' +
      '<div class="kpi-label">'+k.label+'</div>' +
      '<div class="kpi-value">'+k.value+'</div>' +
      '<div class="kpi-sub">'+k.sub+'</div></div>';
  }).join('');

  function renderSection(s){
    var items = s.items.map(function(it){
      var bc = it.badge==='Critico'?'critico':it.badge==='Mejora'?'mejora':'ok';
      return '<div class="item '+it.type+'">' +
        '<div class="item-icon">'+it.icon+'</div><div>' +
        '<div class="item-title">'+it.title+'</div>' +
        '<div class="item-desc">'+it.desc+'</div>' +
        (it.code?'<div class="item-code">'+it.code+'</div>':'') +
        (it.fix?'<div class="item-fix">'+it.fix+'</div>':'') +
        '</div><span class="badge '+bc+'">'+it.badge+'</span></div>';
    }).join('');
    return '<div class="section">' +
      '<div class="section-header">' +
        '<span class="section-num">'+s.num+'</span>' +
        '<span class="section-title '+s.type+'">'+s.icon+' '+s.title+'</span>' +
      '</div><div class="items">'+items+'</div></div>';
  }

  var rows = W.actions.map(function(a){
    return '<tr><td><span class="'+a.cls+'">'+a.priority+'</span></td>' +
      '<td>'+a.action+'</td><td>'+a.responsible+'</td>' +
      '<td class="td-impact">'+a.impact+'</td>' +
      '<td class="td-time">'+a.time+'</td></tr>';
  }).join('');

  var actionsHTML = '<div class="section">' +
    '<div class="section-header">' +
      '<span class="section-num">0'+(W.sections.length+1)+'</span>' +
      '<span class="section-title def">Plan de Accion Priorizado</span>' +
    '</div>' +
    '<div class="table-wrap"><table class="priority-table">' +
      '<thead><tr><th>Prioridad</th><th>Accion</th><th>Responsable</th><th>Impacto</th><th>Tiempo</th></tr></thead>' +
      '<tbody>'+rows+'</tbody></table></div></div>';

  var logoImg = '<div class="logo-circle"><img src="'+W.logo_src+'" alt="MatixMedia"></div>';
  var footerLogoImg = '<div class="footer-logo"><img src="'+W.logo_src+'" alt="MatixMedia"></div>';

  document.getElementById('app').innerHTML =
    /* HEADER — mismo diseño que informe */
    '<div class="report-header">' +
      '<div class="wrap">' +
        '<div class="header-left">' +
          logoImg +
          '<div>' +
            '<div class="header-title">MatixMedia · '+ag.subtitle+'</div>' +
            '<div class="header-client">'+W.client+'</div>' +
            '<div class="header-period">Generado: '+dateStr+'</div>' +
          '</div>' +
        '</div>' +
        '<div class="header-right">' +
          '<div class="header-url">'+W.url+'</div>' +
          '<div class="header-date">Auditoría Web · '+W.date+'</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    /* HERO */
    '<div class="hero">' +
      '<div class="wrap">' +
        '<div class="hero-title">Resumen ejecutivo · '+W.client+'</div>' +
        '<div class="kpi-grid">'+kpiHTML+'</div>' +
      '</div>' +
    '</div>' +

    /* MAIN */
    '<div class="main">' +
      '<div class="wrap">' +
        W.sections.map(renderSection).join('') +
        actionsHTML +
      '</div>' +
    '</div>' +

    /* FOOTER — mismo diseño que informe */
    '<div class="report-footer">' +
      '<div class="wrap">' +
        '<div class="footer-inner">' +
          '<div class="footer-brand">' +
            footerLogoImg +
            '<div>' +
              '<div class="footer-name"><a href="https://www.matixmedia.com.co" target="_blank">MatixMedia</a></div>' +
              '<div class="footer-sub">'+ag.subtitle+'</div>' +
              '<div class="footer-date">Generado: '+dateStr+'</div>' +
            '</div>' +
          '</div>' +
          '<div class="footer-links">' +
            '<a class="footer-social" href="'+ag.instagram+'" target="_blank">'+IG_SVG+'</a>' +
            '<a class="footer-social" href="'+ag.tiktok+'" target="_blank">'+TK_SVG+'</a>' +
            '<a class="footer-wa" style="display:flex;align-items:center;gap:7px;text-decoration:none" href="'+ag.whatsapp+'" target="_blank">'+WA_SVG+' ¿Dudas? Escríbenos</a>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
}



/* ─── MOBILE RESPONSIVE — JS directo (máxima especificidad) ── */
function applyMobile() {
  if (window.innerWidth > 640) return;

  // HEADER
  var hw = document.querySelector('.report-header .wrap');
  if (hw) { hw.style.display='block'; hw.style.padding='16px'; }

  var hl = document.querySelector('.header-left');
  if (hl) {
    hl.style.cssText = 'display:flex;flex-direction:column;align-items:center;' +
                       'justify-content:center;text-align:center;gap:10px;' +
                       'margin-bottom:12px;width:100%';
  }
  document.querySelectorAll('.header-title,.header-client,.header-period').forEach(function(el){
    el.style.textAlign='center'; el.style.display='block'; el.style.width='100%';
  });
  var hr = document.querySelector('.header-right');
  if (hr) { hr.style.textAlign='center'; hr.style.display='block'; hr.style.width='100%'; }
  document.querySelectorAll('.header-url,.header-date').forEach(function(el){
    el.style.textAlign='center'; el.style.display='block';
  });

  // FOOTER
  var fi = document.querySelector('.footer-inner');
  if (fi) {
    fi.style.cssText = 'display:flex;flex-direction:column;align-items:center;' +
                       'text-align:center;gap:16px;width:100%';
  }
  var fb = document.querySelector('.footer-brand');
  if (fb) {
    fb.style.cssText = 'display:flex;flex-direction:column;align-items:center;' +
                       'justify-content:center;gap:10px;width:100%';
  }
  document.querySelectorAll('.footer-name,.footer-sub,.footer-date').forEach(function(el){
    el.style.textAlign='center'; el.style.display='block'; el.style.width='100%';
  });
  var fn = document.querySelector('.footer-name a');
  if (fn) { fn.style.display='block'; fn.style.textAlign='center'; }
  document.querySelectorAll('.footer-right,.footer-links').forEach(function(el){
    el.style.cssText = 'display:flex;justify-content:center;align-items:center;' +
                       'flex-wrap:wrap;gap:10px;width:100%';
  });
}

document.addEventListener('DOMContentLoaded', function(){
  render();
  setTimeout(applyMobile, 50);
});
window.addEventListener('resize', applyMobile);

</script>
