  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#0C0D13;color:#E8E7DF;font-family:'DM Sans',sans-serif}
    #root{min-height:100%}
    a{color:inherit;text-decoration:none}
    button{cursor:pointer;font-family:inherit}
    @keyframes wa-shake{0%,85%,100%{transform:none}87%{transform:rotate(-12deg)}89%{transform:rotate(12deg)}91%{transform:rotate(-8deg)}93%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}97%{transform:rotate(0)}}
    .footer-social:hover{background:#E8C046!important;border-color:#E8C046!important}
    .footer-social:hover svg{fill:#04050A!important}
    @media(max-width:600px){
      .hub-controls{width:100%!important;min-width:0!important;align-items:stretch!important}
      .hub-controls .gs-label{text-align:center!important}
    }
    @media(max-width:640px){
      .footer-inner{flex-direction:column!important;align-items:center!important;text-align:center!important}
      .footer-brand{flex-direction:column!important;align-items:center!important;text-align:center!important}
    }
    /* Custom scrollbar — dark theme */
    .mm-scroll::-webkit-scrollbar{width:4px;height:4px}
    .mm-scroll::-webkit-scrollbar-track{background:transparent}
    .mm-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.10);border-radius:4px}
    .mm-scroll::-webkit-scrollbar-thumb:hover{background:rgba(232,192,70,0.35)}
    .mm-scroll{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.10) transparent}
  </style>

ase de 13 millones de contactos digitales antes de mandar a la gente a tocar puertas.\"","visual":"Foto de Obama en campaña 2008 o gráfico de analítica digital","pantalla":"Obama 2008 · 13M contactos","tip":"Autoridad externa + número concreto = credibilidad prestada. El caso Obama es universalmente conocido y no genera debate político propio."},{"label":"PRUEBA PROPIA","tiempo":"0:33-0:41","color":"#199477","icon":"📊","audio":"\"Nosotros lo replicamos en Colombia: elecciones al Congreso, estrategia 100% digital, más de 130.000 contactos reales. Cero papel tirado a la calle.\"","visual":"Número +130.000 en pantalla grande · rostro seguro","pantalla":"+130.000 contactos reales ✅","tip":"El proof point más poderoso del video — número específico, caso real, resultado concreto. Diferencia a Jairo de cualquiera que solo teoriza."},{"label":"CTA POLARIZANTE","tiempo":"0:41-0:47","color":"#7C3AED","icon":"💬","audio":"\"¿Miedo a innovar o negocio que no quieren soltar? Dime en los comentarios — y si conoces a alguien en política, mándale esto.\"","visual":"Primer plano · señalas cámara","pantalla":"¿Miedo o negocio? 💬👇","tip":"Pregunta polarizante que obliga a elegir un lado + pedido explícito de share. Cada comentario alimenta el algoritmo, cada share amplía el alcance."}],"copy":"El mayor fraude del marketing político no es la corrupción.\nEs el volante que todos saben que va a la basura y mandan igual. 💸\n\nNo es ignorancia. Es un modelo de negocio:\nimprentas, distribución, contratos.\nMoverlo a digital destruye ese ecosistema.\nY eso nadie lo quiere admitir.\n\nLos que sí ganan elecciones lo entendieron hace rato:\n📱 La exposición se construye en digital.\n🏘️ Se convierte en físico.\n\nObama lo demostró en 2008 con 13 millones de contactos\nantes de movilizar gente puerta a puerta.\n\nNosotros lo replicamos en Colombia:\nelecciones al Congreso · estrategia 100% digital\n→ +130.000 contactos reales, sin botar papel a las calles.\n\n¿Miedo a innovar o un modelo que no quieren soltar?\nTe leo 👇\n\n📌 Guarda esto si analizas marketing o política.\n\n#MarketingPolitico #EstrategiaDigital #ConsultoriaPolitica\n#DataDriven #CampañasDigitales #MarketingElectoral","produccion":["Miniatura: foto sosteniendo volante arrugado · texto: ¿La política le teme a lo digital?","Música: tono corporativo/tecnológico/documental · volumen muy bajo","Edición: jump cuts en cada cambio de bloque · corte entre pre-hook y hook seco y rápido","Screen de historia: usar el screenshot real de la historia de Instagram — no recrearlo","Post-publicación: responder todos los comentarios en las primeras 2h para impulsar el algoritmo","CTA de share: pedir en comentarios que lo manden a alguien en política → multiplica alcance"]},{"id":"bonos-google","prioridad":2,"titulo":"Google Actualizó sus Bonos y los Subió","formato":"Reel","plataformas":["Instagram","TikTok"],"estado":"Aprobado","duracion":"44s","fecha_grabacion":"2026-06-20","fecha_publicacion":"2026-06-25","objetivo":"Viralidad por utilidad + autoridad Google Partner + leads keyword BONO","blocks":[{"label":"PRE-HOOK","tiempo":"0:00-0:03","color":"#CF343A","icon":"🚨","audio":"\"Google acaba de actualizar su programa de bonos publicitarios y los aumentó.\"","visual":"Tú a cámara · tono de quien trae info importante","pantalla":"Google actualizó 🚨","tip":"Actualizó es noticia — activa el cerebro diferente a una oferta genérica. La palabra noticia hace que el espectador procese esto como información nueva que necesita."},{"label":"CONTEXTO","tiempo":"0:03-0:10","color":"#4A9EE0","icon":"📱","audio":"\"Lo que antes era un solo bono fijo. Ahora hay varias opciones según el país — y los montos nuevos son los más altos que he visto en mis años como Google Partner.\"","visual":"GS: Screenshot del panel Google Partners con las 3 ofertas · señalas la pantalla","pantalla":"Antes: 1 opción → Ahora: más opciones","tip":"Screenshot real del panel Google Partners = credibilidad inmediata. La comparación antes/ahora activa el FOMO en quien ya tenía una cuenta."},{"label":"EL NÚMERO GANCHO","tiempo":"0:10-0:20","color":"#E8C046","icon":"💰","audio":"\"En Colombia los bonos arrancan en $1.680.000 pesos y llegan hasta $5.880.000 en crédito. En Estados Unidos van desde $500 hasta $6.400 dólares. Y el monto varía según el país donde operes.\"","visual":"GS: Zoom animado al número $1.400 y $6.400 del screenshot · dedo señalando cada uno","pantalla":"Colombia: hasta $5.880.000 🇨🇴 · USA: $500-$6.400 USD 🇺🇸","tip":"Zoom al número más alto en el momento exacto que lo dice = retención máxima. Los números específicos (no redondos) son más creíbles y generan más guardados."},{"label":"LA CONDICIÓN","tiempo":"0:20-0:32","color":"#199477","icon":"⏳","audio":"\"Las condiciones también cambiaron — para mejor. Tienes 30 días desde que creas la cuenta para aplicarlo. Y una vez aplicado, tienes 35 días más para que el crédito aparezca en tu cuenta.\"","visual":"GS: Screenshot del aviso de condiciones de Google · luego corte a primer plano","pantalla":"30 días para aplicar ✅ · 35 días para recibirlo ✅","tip":"Presentar las condiciones como mejora invierte la psicología — no es restricción, es ventaja. Decir que cambió para mejor genera sensación de oportunidad."},{"label":"CÓMO SE APLICA","tiempo":"0:32-0:38","color":"#7C3AED","icon":"👆","audio":"\"Y ahora los Partners podemos aplicarlo directamente desde el panel — un clic y queda vinculado a la cuenta del cliente desde el día uno.\"","visual":"GS: Pantalla del botón Aplicar ofertas ahora en Google Partners","pantalla":"Así se aplica 👆","tip":"Mostrar el botón real demuestra acceso exclusivo como Google Partner. La palabra directamente implica que sin Partner es más difícil — posiciona a Jairo como necesario."},{"label":"CTA","tiempo":"0:38-0:44","color":"#CF343A","icon":"💬","audio":"\"Si tienes cuenta nueva o la vas a crear, comenta BONO abajo y te confirmo si aplica para ti.\"","visual":"Primer plano · señalas cámara","pantalla":"Comenta BONO 👇","tip":"Keyword BONO en comentarios = lead calificado (ya dijo que tiene o quiere una cuenta) + señal al algoritmo de Instagram que tiene interacción de alta intención."}],"copy":"Google actualizó su programa de bonos y los aumentó. 🚨\n\nAntes había un solo monto fijo.\nAhora hay varias opciones — y los nuevos son los\nmás altos que recuerdo en años.\n\n🇨🇴 Colombia:\n→ Desde $1.680.000 hasta $5.880.000 pesos\n   en crédito publicitario\n\n🇺🇸 USA:\n→ Desde $500 USD hasta $6.400 USD en crédito publicitario\n\nEl monto varía según el país donde operes.\n\n✅ Y las condiciones mejoraron:\n→ 30 días para aplicarlo desde que creas la cuenta\n→ 35 días para que el crédito aparezca en tu cuenta\n\nComo Google Partner lo aplico directamente en cuentas de clientes.\nAsí arrancamos con presupuesto extra desde el día 1.\n\n¿Tienes cuenta nueva o la vas a crear?\nComenta BONO 👇 y te confirmo si aplica para ti.\n\n📌 Guarda esto — los bonos de junio no duran para siempre.\n\n#GoogleAds #GooglePartner #PublicidadDigital\n#MarketingDigital #NegociosDigitales #GoogleAdsConsejo","produccion":["Miniatura: tú señalando los números en pantalla · texto grande: Google subió sus bonos 🚨","Música: corporativa/tecnológica · volumen muy bajo","GS 0:03-0:10: Screenshot completo panel Google Partners con las 3 ofertas","GS 0:10-0:20: Zoom animado al número $1.400 y $6.400","GS 0:20-0:32: Screenshot del aviso de condiciones","GS 0:32-0:38: Botón Aplicar ofertas ahora en Google Partners","Badge Google Partner en esquina superior durante todo el video","Duración máxima: 44 segundos — no superar","Post-publicación: responder todos los comentarios BONO en las primeras 2h"]}],"jairo_2026-07":[{"id":"tiktok-search-ads","titulo":"TikTok Acaba de Hacer lo que Google No Esperaba","formato":"Reel","plataformas":["TikTok","Instagram"],"estado":"En revisión","duracion":"55s","fecha_grabacion":"2026-07-20","fecha_publicacion":"2026-07-30","objetivo":"Primicia LATAM · autoridad TikTok Agency Partner + Google Partner · Search Ads Campaign + Search Hubs","blocks":[{"label":"PRE-HOOK","tiempo":"0:00-0:06","color":"#CF343A","icon":"👀","audio":"\"TikTok acaba de hacer algo que Google no esperaba. Y los medios pagados no van a ser iguales.\"","visual":"Tú a cámara · tono de quien trae información verificada · no sensacionalismo","pantalla":"TikTok vs Google 👀","tip":"No dice qué hizo TikTok — eso retiene. La audiencia no puede irse sin saber."},{"label":"LA NOTICIA","tiempo":"0:06-0:18","color":"#E8C046","icon":"🔍","audio":"\"TikTok lanzó Search Ads Campaign: campañas basadas en palabras clave que aparecen directamente en los resultados de búsqueda de TikTok. Igual que Google Ads Search. Pero dentro de TikTok.\"","visual":"GS: pantalla real de TikTok Ads Manager mostrando Search Ads Campaign","pantalla":"Search Ads en TikTok 🔍 Keywords reales","tip":"La pausa antes y después de Igual que Google Ads Search. Pero dentro de TikTok. es el momento de mayor impacto del video."},{"label":"EL COMPORTAMIENTO","tiempo":"0:18-0:28","color":"#4A9EE0","icon":"📊","audio":"\"¿Por qué importa? Porque el 40% de la Generación Z ya usa TikTok en lugar de Google para buscar productos y recomendaciones. Esa intención de búsqueda ya existe. Ahora las marcas pueden capturarla con keywords.\"","visual":"Primer plano · tono educativo directo","pantalla":"40% de Gen Z busca en TikTok 📊","tip":"El 40% de Gen Z es el dato más poderoso — decirlo sin apresurarse. Hace que todo el video tenga sentido."},{"label":"LOS DATOS","tiempo":"0:28-0:40","color":"#199477","icon":"📈","audio":"\"Y los números de TikTok lo confirman: los anunciantes que combinan In-Feed Ads con Search Ads ven un 20% más de conversiones al mismo costo. Y el 18% de los que no convirtieron con el In-Feed, sí convirtieron después de ver el Search Ad.\"","visual":"GS: gráfico simple 2 barras — solo In-Feed vs In-Feed + Search Ads","pantalla":"+20% conversiones · mismo CPA 📈","tip":"Datos oficiales de TikTok for Business — no son estimaciones. Eso los hace citables y compartibles."},{"label":"LA NUEVA CAPA","tiempo":"0:40-0:48","color":"#7C3AED","icon":"🆕","audio":"\"Y en mayo TikTok World anunciaron Search Hubs: páginas de marca al tope de los resultados de búsqueda de TikTok. Las marcas ahora tienen su propio espacio en el buscador de la plataforma.\"","visual":"Primer plano · tono de quien tiene información de primera mano","pantalla":"Search Hubs 🆕 Mayo 2026","tip":"Search Hubs es tan reciente que casi nadie en LATAM la está comunicando. Eso es la primicia dentro de la primicia."},{"label":"CTA","tiempo":"0:48-0:55","color":"#CF343A","icon":"💬","audio":"\"¿Tu agencia ya está corriendo Search Ads en TikTok? Dime en los comentarios si ya lo probaste o si todavía no sabías que existe.\"","visual":"Señalas cámara · cierre directo","pantalla":"¿Ya lo estás usando? 👇","tip":"Si todavía no sabías que existe dicho con curiosidad, no ironía. Nadie quiere quedar en evidencia de que no lo sabía — eso genera comentarios."}],"copy":"TikTok acaba de hacer algo que Google no esperaba. 👀\n\nTikTok lanzó Search Ads Campaign:\ncampañas basadas en palabras clave que aparecen en los resultados de búsqueda de TikTok.\n\nIgual que Google Ads Search.\nPero dentro de TikTok.\n\n¿Por qué importa?\n\nEl 40% de Gen Z ya usa TikTok en lugar de Google para buscar productos.\nEsa intención de búsqueda ya existe.\nAhora las marcas pueden capturarla con keywords reales.\n\nLos datos de TikTok:\n📈 +20% en conversiones al combinar In-Feed + Search Ads · al mismo CPA\n🔄 18% de los que no convirtieron con In-Feed sí convirtieron con el Search Ad\n\nY en TikTok World 2026 (mayo) anunciaron Search Hubs:\npáginas de marca al tope de los resultados de búsqueda de TikTok.\n\nDisponible hoy:\n✅ México · Brasil · USA · UK · España · Australia\n🔜 Colombia y Argentina: targeting a USA disponible\n\n¿Tu agencia ya está corriendo Search Ads en TikTok?\nDime si ya lo probaste o si todavía no sabías que existía 👇\n\n#TikTokAds #SearchAds #PublicidadDigital #MarketingDigital #TikTokAgencyPartner #MarketingLatam","produccion":["GS (0:06): pantalla real de TikTok Ads Manager → Search Ads Campaign — no recrearla","GS (0:28): gráfico 2 barras simple — solo In-Feed vs In-Feed + Search · diferencia del 20%","Miniatura: TikTok ahora tiene keywords 🔍 · fondo oscuro · colores TikTok","Publicar primero en TikTok (nativo), luego en Instagram","La pausa en Igual que Google Ads Search. Pero dentro de TikTok. es crítica — no cortarla","Máximo 55s"]},{"id":"estacionalidad-reel","titulo":"La Estacionalidad Afecta tus Campañas y Probablemente No Sabes lo que Es","formato":"Reel","plataformas":["Instagram","TikTok"],"estado":"Publicado","duracion":"60s","fecha_grabacion":"2026-07-01","fecha_publicacion":"2026-07-02","objetivo":"⚡ URGENTE — publicar esta semana · CTA lead magnet 'Comenta GUÍA' · Mundial termina 19 jul","blocks":[{"label":"HOOK-PROMESA","tiempo":"0:00-0:06","color":"#CF343A","icon":"🕐","audio":"\"La estacionalidad afecta tus campañas y probablemente no sabes lo que es. Te lo explico en un minuto.\"","visual":"Tú a cámara · tono de profesor seguro · sin introducción","pantalla":"Estacionalidad 🕐 1 minuto","tip":"La promesa en un minuto crea un contrato. El espectador acepta quedarse ese tiempo exacto."},{"label":"QUÉ ES","tiempo":"0:06-0:18","color":"#4A9EE0","icon":"📖","audio":"\"La estacionalidad es cuando eventos externos cambian el comportamiento de los usuarios en internet. Fechas especiales, temporadas, eventos masivos. Uno de los más grandes que existe está pasando ahora mismo: el Mundial de fútbol.\"","visual":"GS: texto animado con la definición · bold · fondo oscuro","pantalla":"Eventos externos → usuarios cambian","tip":"El espectador aprende que lo que está viviendo tiene nombre. Eso es el primer foco que prende."},{"label":"EL EFECTO","tiempo":"0:18-0:34","color":"#E8C046","icon":"⚖️","audio":"\"Cuando 5.000 millones de personas tienen la cabeza en el fútbol, pasa algo muy específico en la subasta de publicidad "tiempo":"0:16-0:32","color":"#199477","icon":"✅","audio":"\"AI Max for Search no reemplaza tus palabras clave. Las amplifica. Sigue usando tus keywords como punto de partida — pero además lee el contenido de tu landing page y el contexto de la búsqueda para encontrar más consultas relevantes que tú no habías definido.\"","visual":"Primer plano · tono directo · de quien corrige con datos","pantalla":"AI Max amplifica keywords. No las elimina.","tip":"La frase que más se va a compartir: AI Max amplifica, no elimina. Simple, precisa, desmiente algo que mucha gente creyó."},{"label":"LO QUE SÍ CAMBIÓ","tiempo":"0:32-0:43","color":"#4A9EE0","icon":"📐","audio":"\"Lo que sí cambió es el nivel de control sobre el matching. Google puede ahora mostrarte en búsquedas que tú no elegiste. Y eso tiene implicaciones reales para tu cuenta que hay que entender y configurar bien.\"","visual":"GS: pantalla real de configuración de AI Max en Google Ads","pantalla":"Lo que cambió: el control sobre el matching","tip":"Dar la parte real del cambio evita que el video parezca que defiende el statu quo. Hay algo nuevo — pero no es lo que te dijeron."},{"label":"CTA","tiempo":"0:43-0:50","color":"#CF343A","icon":"💬","audio":"\"¿Tu agencia te dijo que podías eliminar las keywords con AI Max? Cuéntame en los comentarios qué te explicaron.\"","visual":"Señalas cámara · cierre directo","pantalla":"¿Qué te dijeron? 👇","tip":"Genera comentarios de personas que recibieron mala información. Jairo responde a cada uno con la corrección → autoridad conversacional."}],"copy":"\"Google mató las palabras clave.\"\n\nO al menos eso es lo que te han dicho. 👀\n\nHay gurus diciéndote que las keywords ya no importan.\nQue con AI Max Google lo hace todo solo.\n\nLa realidad:\n\nAI Max for Search NO reemplaza tus palabras clave.\nLas amplifica.\n\n→ Usa tus keywords como punto de partida\n→ Lee el contenido de tu landing page\n→ Analiza el contexto de la búsqueda\n→ Encuentra más consultas que tú no habías definido\n\nLo que SÍ cambió:\n→ El nivel de control sobre el matching\n→ Google puede mostrarte en búsquedas que tú no elegiste\n\n¿Tu agencia te dijo que podías eliminar las keywords con AI Max?\nCuéntame qué te explicaron 👇\n\n#GoogleAds #AIMax #PublicidadDigital #GooglePartner","produccion":["GS El mito: screenshots REALES de posts que digan keywords murieron — no inventarlos","GS Lo que sí cambió: pantalla real de configuración de AI Max en Google Ads","Miniatura: Google mató las keywords (tachado) + ¿o no? en amarillo","Máximo 50s"]},{"id":"error-meta-2026","prioridad":4,"titulo":"El Mayor Error en Meta Ads 2026","formato":"Reel","plataformas":["Instagram","TikTok"],"estado":"En revisión","duracion":"44s","fecha_grabacion":"2026-07-20","fecha_publicacion":"2026-07-28","objetivo":"Autoridad en Meta Ads · posicionarse contra la segmentación obsoleta","blocks":[{"label":"PRE-HOOK","tiempo":"0:00-0:04","color":"#CF343A","icon":"👀","audio":"\"Si todavía pasas horas construyendo audiencias detalladas en Meta, te tengo una noticia incómoda.\"","visual":"Tú a cámara · tono directo · sin GS","pantalla":"Noticia incómoda 👀","tip":"Desafía el comportamiento actual del espectador de forma personal. Quien hace exactamente eso se queda porque necesita saber qué está haciendo mal."},{"label":"EL PROBLEMA","tiempo":"0:04-0:12","color":"#E8C046","icon":"❌","audio":"\"Intereses. Comportamientos. Exclusiones. Capas sobre capas de segmentación. En 2020 eso era el trabajo del media buyer. En 2026 es tiempo perdido.\"","visual":"GS: Ads Manager · sección de audiencias con intereses y comportamientos complejos","pantalla":"Segmentación compleja = 2020 ❌","tip":"Nombrar el comportamiento obsoleto (capas de segmentación) sin atacar a la persona. La comparación 2020 vs 2026 contextualiza sin humillar."},{"label":"ANDROMEDA","tiempo":"0:12-0:22","color":"#4A9EE0","icon":"🤖","audio":"\"Meta lanzó Andromeda: su nuevo algoritmo de distribución. Y Andromeda premia la diversidad creativa sobre la complejidad de segmentación. En otras palabras: la creatividad ES la segmentación.\"","visual":"Primer plano · tono de revelación · sin GS","pantalla":"Andromeda: creatividad = segmentación","tip":"El concepto citable que se queda en la memoria — la creatividad ES la segmentación. Una frase que los marketers van a repetir porque explica algo complejo en 6 palabras."},{"label":"LA PRUEBA","tiempo":"0:22-0:32","color":"#7C3AED","icon":"📋","audio":"\"Y Meta lo confirmó en marzo 2026: eliminaron el Flexible Format y lo distribuyeron entre Advantage+ Creative. La IA ahora gestiona los formatos a escala. Tu trabajo no es elegir quién ve el anuncio — es crear el anuncio que la IA le va a mostrar a quien ya quiere comprarlo.\"","visual":"GS: pantalla real de Flexible Format eliminado en Meta Ads · pantalla de Advantage+ Creative","pantalla":"Flexible Format → eliminado marzo 2026","tip":"Prueba concreta con fecha y nombre específico (Flexible Format, Advantage+ Creative) = no es opinión, es hecho verificable. La frase final define el nuevo rol del media buyer."},{"label":"CTA","tiempo":"0:32-0:44","color":"#CF343A","icon":"💬","audio":"\"¿Cuántas creatividades activas tienes corriendo ahora mismo en Meta? Dime el número en los comentarios — te digo si es suficiente o no.\"","visual":"Señalas cámara · directo","pantalla":"¿Cuántas creatividades? 👇","tip":"Pregunta con número = respuestas medibles + debate visible. Jairo puede responder a cada comentario y generar interacción 1:1 que el algoritmo interpreta como engagement de alta calidad."}],"copy":"Si sigues obsesionado con la segmentación en Meta, estás jugando con las reglas de 2020. 👀\n\nEn 2026 la ecuación cambió:\n\nAntes: \"Muéstrale esto a mujeres de 25-35 que les guste el yoga\"\nAhora: la IA sabe mejor que tú a quién mostrárselo\n\nMeta lanzó Andromeda — su nuevo algoritmo — y premia la diversidad creativa sobre la complejidad de segmentación.\n\nY en marzo 2026 lo confirmó:\n→ Eliminó el Flexible Format\n→ Lo distribuyó entre Advantage+ Creative\n→ La IA gestiona los formatos a escala\n\nTu trabajo ya no es construir audiencias.\nEs crear el cebo perfecto para que la IA lo entregue a quien ya quiere comprarlo.\n\nLa creatividad ES la segmentación.\n\n¿Cuántas creatividades activas tienes corriendo ahora mismo?\nDime el número 👇 — te digo si es suficiente.\n\n#MetaAds #FacebookAds #PublicidadDigital #MarketingDigital #MediaBuyer","produccion":["GS: pantalla real de Ads Manager con audiencias complejas + Flexible Format eliminado","Miniatura: texto Segmentación en Meta 2026: error · tono de alerta","La pregunta del CTA es el motor de comentarios — no cambiarla","Música: corporativa · sube en la creatividad ES la segmentación","Máximo 44s"]},{"id":"reels-vs-carrusel","prioridad":5,"titulo":"Para de Publicar Solo Reels","formato":"Carrusel","plataformas":["Instagram"],"estado":"En revisión","duracion":"8 slides","fecha_grabacion":"2026-07-08","fecha_publicacion":"2026-07-24","objetivo":"Guardar masivo entre marketers · educación sobre cuándo usar cada formato","blocks":[{"label":"SLIDE 1 — HOOK","tiempo":"Slide 1","color":"#E8C046","icon":"🎯","audio":"El formato que más guardados genera en IG en 2026 no es el Reel.","visual":"Fondo oscuro · texto grande · emoji de sorpresa · tipografía bold","pantalla":"No es el Reel 👀","tip":"La afirmación contraintuitiva que obliga a deslizar. Quien cree que los Reels son lo único que funciona necesita saber por qué está equivocado."},{"label":"SLIDE 2 — EL MITO","tiempo":"Slide 2","color":"#CF343A","icon":"❌","audio":"Todos dicen que los Reels son lo único que funciona. Pero hay algo que el Reel no puede hacer que el carrusel sí. El Reel te da alcance. El carrusel te da atención profunda.","visual":"Dos columnas: Reel = alcance vs Carrusel = atención profunda","pantalla":"Reel = alcance · Carrusel = profundidad","tip":"El contraste claro en dos columnas hace que el concepto sea inmediatamente comprensible. No son formatos en competencia, son herramientas diferentes."},{"label":"SLIDE 3 — POR QUÉ","tiempo":"Slide 3","color":"#4A9EE0","icon":"🧠","audio":"Cuando alguien desliza un carrusel, el algoritmo lo interpreta como señal de alta intención. Cada swipe es más tiempo en tu contenido, más distribución. Los guardados en carrusel son 3 veces más frecuentes que en Reels educativos.","visual":"Ícono de dedo deslizando · diagrama simple de swipe → tiempo → distribución","pantalla":"Cada swipe = señal al algoritmo","tip":"El mecanismo técnico (swipe = señal de intención) explica por qué funciona. El dato 3x más guardados es lo que más se cita en comentarios."},{"label":"SLIDE 4 — CUÁNDO REEL","tiempo":"Slide 4","color":"#199477","icon":"✅","audio":"Usa Reels cuando quieres alcance masivo a audiencias nuevas, tienes un hook visual fuerte, la novedad o tendencia es el gancho, o el mensaje cabe en menos de 45 segundos.","visual":"Lista con checks verdes · fondo verde suave","pantalla":"Cuándo usar Reels ✅","tip":"La guía práctica que la gente guarda. Cuatro criterios concretos que eliminan la duda de cuándo usar Reels."},{"label":"SLIDE 5 — CUÁNDO CARRUSEL","tiempo":"Slide 5","color":"#199477","icon":"✅","audio":"Usa Carruseles cuando quieres que te guarden y vuelvan, tienes una lista, proceso o comparación, el contenido necesita más de una pantalla para entenderse, o quieres enseñar algo paso a paso.","visual":"Lista con checks verdes · fondo verde suave","pantalla":"Cuándo usar Carrusel ✅","tip":"La guía práctica complementaria. El criterio de más de una pantalla es el más compartido porque resuelve la duda más frecuente."},{"label":"SLIDE 6 — LA ESTRATEGIA","tiempo":"Slide 6","color":"#7C3AED","icon":"🔗","audio":"Los dos juntos ganan. Reel como gancho, Carrusel como conversión. Publica el Reel primero para alcance masivo. Si el tema funciona, hazlo carrusel — los seguidores que llegaron del Reel lo guardan y lo comparten.","visual":"Diagrama: Reel → Carrusel · flujo visual de la estrategia","pantalla":"Reel → Carrusel = la estrategia ganadora","tip":"La síntesis que da el insight de todo el carrusel. El diagrama Reel → Carrusel es la imagen que más se guarda y se cita."},{"label":"SLIDE 7 — SPECS 2026","tiempo":"Slide 7","color":"#E8C046","icon":"📐","audio":"Especificaciones actualizadas: Reels, formato 9 por 16, 1080 por 1920 píxeles, máximo 90 segundos pero el óptimo es entre 15 y 45 segundos. Carrusel: hasta 20 slides, formato 4 por 5 de 1080 por 1350 píxeles recomendado, y la primera slide es la portada — la más importante.","visual":"Tabla limpia con specs técnicos · dos columnas: Reels y Carrusel","pantalla":"Specs actualizados 2026","tip":"El dato técnico que hace guardar el carrusel. Los specs concretos son lo que más buscan los creadores antes de producir contenido."},{"label":"SLIDE 8 — CTA","tiempo":"Slide 8","color":"#CF343A","icon":"💬","audio":"Guarda este carrusel para tenerlo de referencia. Y dime en los comentarios qué formato está generando más engagement en tu cuenta.","visual":"Fondo de marca · CTA claro · instrucción de guardar visible","pantalla":"Guarda 📌 y dime 👇","tip":"CTA doble: guardar + comentar = máximo engagement. La pregunta sobre qué formato les funciona genera respuestas útiles para Jairo también."}],"copy":"Para de publicar solo Reels. 🛑\n\nEl formato que más guardados genera en IG en 2026 no es el Reel — es el carrusel bien hecho.\n\nY no, no son lo mismo:\n📱 Reel = alcance masivo, atención corta\n📋 Carrusel = menos alcance, engagement profundo\n\nLa estrategia que funciona en 2026:\n→ Usa el Reel para que te descubran\n→ Usa el carrusel para que se queden\n\nDesliza para ver cuándo usar cada uno 👉\n\n¿Cuál te está funcionando mejor?\nDime en los comentarios 👇\n\n📌 Guarda esto para tenerlo de referencia.\n\n#MarketingDigital #InstagramMarketing #ContentStrategy #ReelsvsCarrusel #MarketingLatam","produccion":["Diseñar en Canva con brand kit de Jairo (cuando esté listo)","Primera slide = hook visual bold — es lo que decide si desliza o no","Cada slide debe tener un solo concepto — no sobrecargar texto","Ratio 4:5 (1080x1350px) para mayor presencia en feed"]},{"id":"batalla-venta","prioridad":6,"titulo":"La Batalla de la Venta","formato":"Reel","plataformas":["Instagram","TikTok"],"estado":"Publicado","duracion":"45s","fecha_grabacion":"2026-07-14","fecha_publicacion":"2026-07-16","objetivo":"Viralidad por concepto propio + autoridad + leads orgánicos","blocks":[{"label":"PRE-HOOK","tiempo":"0:00-0:05","color":"#E8C046","icon":"🎓","audio":"\"Hay algo que enseño en mis clases y que siempre conecta. Cada vez que vendes algo, hay una guerra que nadie te explicó.\"","visual":"Tú a cámara · tono de profesor que va a compartir algo probado · no de revelación sino de clase","pantalla":"Una guerra que nadie te explicó ⚔️","tip":"El frame de clase + siempre conecta es prueba social antes de que empiece el concepto. El espectador ya sabe que lo que viene vale la pena escuchar."},{"label":"NOMBRAR LA BATALLA","tiempo":"0:05-0:12","color":"#CF343A","icon":"🥊","audio":"\"El comprador quiere comprar al precio más económico. El vendedor quiere vender al precio más alto. Solo uno puede ganar. Yo la llamo la batalla de la venta.\"","visual":"Primer plano · gestos con las manos mostrando dos lados opuestos","pantalla":"Comprador vs Vendedor ⚔️","tip":"Nombrar el concepto propio — la batalla de la venta es de Jairo. Crea terminología citable que la gente va a repetir y asociar con él."},{"label":"LA LEY","tiempo":"0:12-0:22","color":"#4A9EE0","icon":"⚖️","audio":"\"Pero esto lo define una ley básica — la ley de oferta y demanda: cuando hay mucha oferta, el comprador manda y los precios bajan. Cuando la demanda supera la oferta, el vendedor manda y los precios suben.\"","visual":"GS: balanza visual simple — un lado sube mientras el otro baja","pantalla":"Mucha oferta → comprador gana · Mucha demanda → vendedor gana","tip":"Un concepto complejo simplificado en dos líneas con la balanza. El GS hace accesible la economía rror antes de explicarlo — genera curiosidad. La frase no es el presupuesto invierte la expectativa de la audiencia que esperaba otro tipo de error."},{"label":"EL DATO","tiempo":"0:04-0:12","color":"#E8C046","icon":"📊","audio":"\"En las auditorías que hago, el 90% de los P-Max que reviso están mal configurados. No porque la campaña sea mala — sino porque la lanzaron demasiado pronto.\"","visual":"GS: pantalla de P-Max en Google Ads · señalas la campaña","pantalla":"90% mal configurados 📊","tip":"El porcentaje concreto (90%) hace la afirmación medible y provocadora. La razón (demasiado pronto, no la campaña) desmonta la defensa antes de que aparezca."},{"label":"POR QUÉ FALLA","tiempo":"0:12-0:24","color":"#4A9EE0","icon":"🔢","audio":"\"P-Max necesita mínimo 50 conversiones al mes para que el algoritmo optimice bien. Sin esas señales, la IA no sabe a quién mostrarle el anuncio y el presupuesto se va en impresiones que no convierten. La mayoría lo lanza el día 1, con cuenta nueva, sin historial.\"","visual":"Primer plano · explica con los dedos contando · 1-2-3","pantalla":"50 conv/mes mínimo · sin historial = dinero perdido","tip":"El número específico (50 conversiones/mes) hace el error tangible y verificable. La imagen del presupuesto yéndose en impresiones que no convierten es la más impactante para el espectador con dinero invertido."},{"label":"EL VILLANO","tiempo":"0:24-0:33","color":"#CF343A","icon":"🏭","audio":"\"Y el problema es que las agencias lo presentan como la solución mágica. Lanzamos P-Max y el algoritmo hace todo el trabajo. Sí — pero el algoritmo necesita datos para trabajar. Sin datos, trabaja para nada.\"","visual":"Primer plano · directo · sin gestos exagerados","pantalla":"P-Max no es magia 🪄","tip":"Nombrar la promesa falsa de las agencias (solución mágica) genera debate. Quienes la han escuchado se identifican, quienes la han dicho se defienden."},{"label":"LA SOLUCIÓN","tiempo":"0:33-0:40","color":"#199477","icon":"✅","audio":"\"La secuencia correcta: Search primero, 30 conversiones, luego tCPA, 50 conversiones — ahí lanzas P-Max. Con señales reales.\"","visual":"GS: diagrama visual de la secuencia correcta en 4 pasos","pantalla":"Search → 30 conv → tCPA → 50 conv → P-Max ✅","tip":"La solución visual en 4 pasos es lo que más se guarda del video. El diagrama debe verse simple y claro — es la hoja de ruta que la gente busca."},{"label":"CTA","tiempo":"0:40-0:44","color":"#CF343A","icon":"💬","audio":"\"¿Tienes P-Max activo? Dime cuántas conversiones al mes tiene tu cuenta.\"","visual":"Señalas cámara","pantalla":"¿Cuántas conversiones? 👇","tip":"Pregunta que revela el estado real de la cuenta del espectador. Quien responde ya dijo si su P-Max tiene las señales necesarias o no."}],"copy":"El error más caro en Google Ads no es el presupuesto.\nEs lanzar P-Max sin estar listos. 💸\n\nEn las auditorías que hago, el 90% de los P-Max que reviso están mal configurados.\n\nNo porque la campaña sea mala.\nPorque la lanzaron demasiado pronto.\n\nP-Max necesita mínimo 50 conversiones/mes para optimizar bien.\nSin esas señales, la IA no sabe a quién mostrarle el anuncio.\nY el presupuesto se va en impresiones que no convierten.\n\nEl problema: las agencias lo venden como magia.\n\"Lanzamos P-Max y el algoritmo hace todo.\"\n\nSí — pero el algoritmo necesita datos para trabajar.\nSin datos, trabaja para nada.\n\nLa secuencia correcta:\n1️⃣ Search manual CPC primero\n2️⃣ Acumula 30 conversiones → activa tCPA\n3️⃣ Llega a 50 conv/mes → lanza P-Max con señales reales\n\n¿Tienes P-Max activo?\nDime cuántas conversiones al mes tiene tu cuenta 👇\n\n#GoogleAds #PMax #PerformanceMax #MarketingDigital #GooglePartner #PublicidadDigital","produccion":["GS: pantalla real de P-Max en Google Ads + diagrama de la secuencia correcta","Miniatura: texto P-Max sin señales = dinero a la basura · tono de alerta","El número 90% en pantalla grande cuando lo menciona","El diagrama de secuencia (0:33) debe ser claro y simple — 4 pasos visuale
