  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#0C0D13;color:#E8E7DF;font-family:'DM Sans',sans-serif}
    #root{min-height:100%}
    a{color:inherit;text-decoration:none}
    button{cursor:pointer;font-family:inherit}
    @keyframes wa-shake{0%,85%,100%{transform:none}87%{transform:rotate(-12deg)}89%{transform:rotate(12deg)}91%{transform:rotate(-8deg)}93%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}97%{transform:rotate(0)}}
    .footer-social:hover{background:#E8C046!important;border-color:#E8C046!important}
    .footer-social:hover svg{fill:#04050A!important}
    @media(max-width:600px){
      .hub-controls{width:100%!important;min-width:0!important;align-items:stretch!important}
      .hub-controls .gs-label{text-align:center!important}
    }
    @media(max-width:640px){
      .footer-inner{flex-direction:column!important;align-items:center!important;text-align:center!important}
      .footer-brand{flex-direction:column!important;align-items:center!important;text-align:center!important}
    }
    /* Custom scrollbar — dark theme */
    .mm-scroll::-webkit-scrollbar{width:4px;height:4px}
    .mm-scroll::-webkit-scrollbar-track{background:transparent}
    .mm-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.10);border-radius:4px}
    .mm-scroll::-webkit-scrollbar-thumb:hover{background:rgba(232,192,70,0.35)}
    .mm-scroll{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.10) transparent}
  </style>

️","audio":"\"...y me di cuenta de que el problema era más profundo de lo que pensaba.\"","visual":"Corte seco · tú a cámara directo · energía alta","pantalla":"—","tip":"Abre un loop de expectativa antes del hook principal. El cambio brusco de ritmo mantiene la atención en el momento crítico."},{"label":"HOOK","tiempo":"0:08-0:12","color":"#CF343A","icon":"🎯","audio":"\"Los partidos políticos saben exactamente que sus volantes van a la basura.\"","visual":"Primer plano · sin distracciones · corte limpio","pantalla":"—","tip":"Declaración que nombra un culpable — dispara comentarios de quienes están de acuerdo y de quienes defienden el sistema."},{"label":"OPEN LOOP","tiempo":"0:12-0:16","color":"#E8C046","icon":"👀","audio":"\"Y los mandan igual. ¿Por qué?\"","visual":"Zoom out sutil · Green Screen con imagen de volantes en el suelo","pantalla":"¿Por qué? 👀","tip":"Pregunta sin responder = el espectador no puede irse hasta saber. Es el mecanismo más poderoso de retención en video corto."},{"label":"VILLAIN","tiempo":"0:16-0:22","color":"#CF343A","icon":"🏭","audio":"\"Porque hay un modelo de negocio montado alrededor del papel. Imprentas, distribución, contratos. Moverlo a digital destruye ese negocio. No es ignorancia, es interés.\"","visual":"Quitas GS · primer plano directo","pantalla":"El negocio del papel","tip":"Nombrar al villano específico (imprentas/contratos) genera más comentarios que una crítica genérica. La audiencia lo va a compartir para validar lo que ya sospechaba."},{"label":"REGLA DE ORO","tiempo":"0:22-0:28","color":"#E8C046","icon":"🥇","audio":"\"Los que sí ganan elecciones lo entendieron hace tiempo: la exposición se gana en digital y se afianza en físico. No al revés.\"","visual":"Cambio de ángulo ligero","pantalla":"Regla de oro 🥇","tip":"Contraste claro entre los que ganan y los que pierden. Posiciona a Jairo como quien sabe cuál es el lado correcto."},{"label":"PRUEBA EXTERNA","tiempo":"0:28-0:33","color":"#4A9EE0","icon":"🇺🇸","audio":"\"Obama lo demostró en 2008: construyó una base de 13 millones de contactos digitales antes de mandar a la gente a tocar puertas.\"","visual":"Foto de Obama en campaña 2008 o gráfico de analítica digital","pantalla":"Obama 2008 · 13M contactos","tip":"Autoridad externa + número concreto = credibilidad prestada. El caso Obama es universalmente conocido y no genera debate político propio."},{"label":"PRUEBA PROPIA","tiempo":"0:33-0:41","color":"#199477","icon":"📊","audio":"\"Nosotros lo replicamos en Colombia: elecciones al Congreso, estrategia 100% digital, más de 130.000 contactos reales. Cero papel tirado a la calle.\"","visual":"Número +130.000 en pantalla grande · rostro seguro","pantalla":"+130.000 contactos reales ✅","tip":"El proof point más poderoso del video — número específico, caso real, resultado concreto. Diferencia a Jairo de cualquiera que solo teoriza."},{"label":"CTA POLARIZANTE","tiempo":"0:41-0:47","color":"#7C3AED","icon":"💬","audio":"\"¿Miedo a innovar o negocio que no quieren soltar? Dime en los comentarios — y si conoces a alguien en política, mándale esto.\"","visual":"Primer plano · señalas cámara","pantalla":"¿Miedo o negocio? 💬👇","tip":"Pregunta polarizante que obliga a elegir un lado + pedido explícito de share. Cada comentario alimenta el algoritmo, cada share amplía el alcance."}],"copy":"El mayor fraude del marketing político no es la corrupción.\nEs el volante que todos saben que va a la basura y mandan igual. 💸\n\nNo es ignorancia. Es un modelo de negocio:\nimprentas, distribución, contratos.\nMoverlo a digital destruye ese ecosistema.\nY eso nadie lo quiere admitir.\n\nLos que sí ganan elecciones lo entendieron hace rato:\n📱 La exposición se construye en digital.\n🏘️ Se convierte en físico.\n\nObama lo demostró en 2008 con 13 millones de contactos\nantes de movilizar gente puerta a puerta.\n\nNosotros lo replicamos en Colombia:\nelecciones al Congreso · estrategia 100% digital\n→ +130.000 contactos reales, sin botar papel a las calles.\n\n¿Miedo a innovar o un modelo que no quieren soltar?\nTe leo 👇\n\n📌 Guarda esto si analizas marketing o política.\n\n#MarketingPolitico #EstrategiaDigital #ConsultoriaPolitica\n#DataDriven #CampañasDigitales #MarketingElectoral","produccion":["Miniatura: foto sosteniendo volante arrugado · texto: ¿La política le teme a lo digital?","Música: tono corporativo/tecnológico/documental · volumen muy bajo","Edición: jump cuts en cada cambio de bloque · corte entre pre-hook y hook seco y rápido","Screen de historia: usar el screenshot real de la historia de Instagram — no recrearlo","Post-publicación: responder todos los comentarios en las primeras 2h para impulsar el algoritmo","CTA de share: pedir en comentarios que lo manden a alguien en política → multiplica alcance"]},{"id":"bonos-google","prioridad":2,"titulo":"Google Actualizó sus Bonos y los Subió","formato":"Reel","plataformas":["Instagram","TikTok"],"estado":"Aprobado","duracion":"44s","fecha_grabacion":"2026-06-20","fecha_publicacion":"2026-06-25","objetivo":"Viralidad por utilidad + autoridad Google Partner + leads keyword BONO","blocks":[{"label":"PRE-HOOK","tiempo":"0:00-0:03","color":"#CF343A","icon":"🚨","audio":"\"Google acaba de actualizar su programa de bonos publicitarios y los aumentó.\"","visual":"Tú a cámara · tono de quien trae info importante","pantalla":"Google actualizó 🚨","tip":"Actualizó es noticia — activa el cerebro diferente a una oferta genérica. La palabra noticia hace que el espectador procese esto como información nueva que necesita."},{"label":"CONTEXTO","tiempo":"0:03-0:10","color":"#4A9EE0","icon":"📱","audio":"\"Lo que antes era un solo bono fijo. Ahora hay varias opciones según el país — y los montos nuevos son los más altos que he visto en mis años como Google Partner.\"","visual":"GS: Screenshot del panel Google Partners con las 3 ofertas · señalas la pantalla","pantalla":"Antes: 1 opción → Ahora: más opciones","tip":"Screenshot real del panel Google Partners = credibilidad inmediata. La comparación antes/ahora activa el FOMO en quien ya tenía una cuenta."},{"label":"EL NÚMERO GANCHO","tiempo":"0:10-0:20","color":"#E8C046","icon":"💰","audio":"\"En Colombia los bonos arrancan en $1.680.000 pesos y llegan hasta $5.880.000 en crédito. En Estados Unidos van desde $500 hasta $6.400 dólares. Y el monto varía según el país donde operes.\"","visual":"GS: Zoom animado al número $1.400 y $6.400 del screenshot · dedo señalando cada uno","pantalla":"Colombia: hasta $5.880.000 🇨🇴 · USA: $500-$6.400 USD 🇺🇸","tip":"Zoom al número más alto en el momento exacto que lo dice = retención máxima. Los números específicos (no redondos) son más creíbles y generan más guardados."},{"label":"LA CONDICIÓN","tiempo":"0:20-0:32","color":"#199477","icon":"⏳","audio":"\"Las condiciones también cambiaron — para mejor. Tienes 30 días desde que creas la cuenta para aplicarlo. Y una vez aplicado, tienes 35 días más para que el crédito aparezca en tu cuenta.\"","visual":"GS: Screenshot del aviso de condiciones de Google · luego corte a primer plano","pantalla":"30 días para aplicar ✅ · 35 días para recibirlo ✅","tip":"Presentar las condiciones como mejora invierte la psicología — no es restricción, es ventaja. Decir que cambió para mejor genera sensación de oportunidad."},{"label":"CÓMO SE APLICA","tiempo":"0:32-0:38","color":"#7C3AED","icon":"👆","audio":"\"Y ahora los Partners podemos aplicarlo directamente desde el panel — un clic y queda vinculado a la cuenta del cliente desde el día uno.\"","visual":"GS: Pantalla del botón Aplicar ofertas ahora en Google Partners","pantalla":"Así se aplica 👆","tip":"Mostrar el botón real demuestra acceso exclusivo como Google Partner. La palabra directamente implica que sin Partner es más difícil — posiciona a Jairo como necesario."},{"label":"CTA","tiempo":"0:38-0:44","color":"#CF343A","icon":"💬","audio":"\"Si tienes cuenta nueva o la vas a crear, comenta BONO abajo y te confirmo si aplica para ti.\"","visual":"Primer plano · señalas cámara" ados 📊","tip":"El porcentaje concreto (90%) hace la afirmación medible y provocadora. La razón (demasiado pronto, no la campaña) desmonta la defensa antes de que aparezca."},{"label":"POR QUÉ FALLA","tiempo":"0:12-0:24","color":"#4A9EE0","icon":"🔢","audio":"\"P-Max necesita mínimo 50 conversiones al mes para que el algoritmo optimice bien. Sin esas señales, la IA no sabe a quién mostrarle el anuncio y el presupuesto se va en impresiones que no convierten. La mayoría lo lanza el día 1, con cuenta nueva, sin historial.\"","visual":"Primer plano · explica con los dedos contando · 1-2-3","pantalla":"50 conv/mes mínimo · sin historial = dinero perdido","tip":"El número específico (50 conversiones/mes) hace el error tangible y verificable. La imagen del presupuesto yéndose en impresiones que no convierten es la más impactante para el espectador con dinero invertido."},{"label":"EL VILLANO","tiempo":"0:24-0:33","color":"#CF343A","icon":"🏭","audio":"\"Y el problema es que las agencias lo presentan como la solución mágica. Lanzamos P-Max y el algoritmo hace todo el trabajo. Sí — pero el algoritmo necesita datos para trabajar. Sin datos, trabaja para nada.\"","visual":"Primer plano · directo · sin gestos exagerados","pantalla":"P-Max no es magia 🪄","tip":"Nombrar la promesa falsa de las agencias (solución mágica) genera debate. Quienes la han escuchado se identifican, quienes la han dicho se defienden."},{"label":"LA SOLUCIÓN","tiempo":"0:33-0:40","color":"#199477","icon":"✅","audio":"\"La secuencia correcta: Search primero, 30 conversiones, luego tCPA, 50 conversiones — ahí lanzas P-Max. Con señales reales.\"","visual":"GS: diagrama visual de la secuencia correcta en 4 pasos","pantalla":"Search → 30 conv → tCPA → 50 conv → P-Max ✅","tip":"La solución visual en 4 pasos es lo que más se guarda del video. El diagrama debe verse simple y claro — es la hoja de ruta que la gente busca."},{"label":"CTA","tiempo":"0:40-0:44","color":"#CF343A","icon":"💬","audio":"\"¿Tienes P-Max acti /* Navbar \u2014 igual al hub */
.nav{display:flex;align-items:center;gap:10px;padding:14px 28px;background:rgba(12,13,19,0.97);border-bottom:1px solid rgba(255,255,255,0.07);margin-bottom:0}
.nav-logo{width:32px;height:32px;border-radius:50%;border:2px solid #E8C046;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#14151C}
.nav-logo img{width:100%;height:100%;object-fit:contain;padding:2px}
.nav-brand{font-size:13px;color:#E8C046;font-weight:400;letter-spacing:.02em}
.nav-sep{color:#3A3B44;font-size:13px;margin:0 2px}
.nav-sub{font-size:13px;color:#A8A598}
/* Card t\xEDtulo \u2014 como el header del popup */
.card-hdr{background:rgba(18,19,28,0.9);border-bottom:1px solid rgba(255,255,255,0.06);padding:18px 28px}
.card-title{font-size:18px;font-weight:600;color:#FDFCF7;margin-bottom:8px;line-height:1.25;letter-spacing:-.01em}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag-c{font-size:10px;font-family:'DM Mono',monospace;color:#E8C046;padding:2px 8px;border-radius:4px;background:rgba(232,192,70,0.10)}
.tag-m{font-size:10px;font-family:'DM Mono',monospace;color:#A8A598}
.tag-e{font-size:10px;font-family:'DM Mono',monospace;padding:1px 7px;border-radius:4px}
.dot{color:#2A2B34;font-size:11px}
/* Body del popup */
.body{padding:20px 28px;display:flex;flex-direction:column;gap:18px}
/* Chips meta */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-fmt{font-size:10px;font-family:'DM Mono',monospace;color:#A8A598;padding:2px 9px;border-radius:4px;background:#14151C;border:1px solid #1E1F28}
.chip-plt{font-size:10px;font-family:'DM Mono',monospace;color:#5A5A52;padding:2px 0}
.chip-date-g{font-size:10px;font-family:'DM Mono',monospace;color:#4A9EE0;padding:2px 9px;border-radius:4px;background:rgba(74,158,224,0.08)}
.chip-date-p{font-size:10px;font-family:'DM Mono',monospace;color:#7C3AED;padding:2px 9px;border-radius:4px;background:rgba(124,58,237,0.08)}
/* Objetivo */
.obj{font-size:11px;font-family:'DM Mono',monospace;color:#5A5A52;line-height:1.6}
/* Section label */
.sec-lbl{font-size:9px;font-family:'DM Mono',monospace;color:#3A3B44;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
/* Copy */
.copy-txt{font-size:12px;color:#A8A598;line-height:1.7;white-space:pre-wrap;font-family:'DM Sans',sans-serif}
/* Bloques guion */
.blk{background:#0E0F18;border:1px solid #1E1F28;border-radius:8px;padding:12px 14px;margin-bottom:8px;page-break-inside:avoid}
.blk-num{font-size:9px;font-family:'DM Mono',monospace;color:#E8C046;opacity:.7;margin-bottom:7px}
.blk-row{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.blk-ico{font-size:11px;flex-shrink:0;margin-top:1px}
.blk-lbl{font-size:9px;font-family:'DM Mono',monospace;color:#3A3B44;flex-shrink:0;width:52px;padding-top:1px}
.blk-val{font-size:12px;color:#FDFCF7;line-height:1.6}
.blk-val-dim{font-size:12px;color:#A8A598;line-height:1.6}
.blk-val-muted{font-size:12px;color:#5A5A52;line-height:1.6;font-style:italic}
/* Producci\xF3n */
.prod-item{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;background:#0E0F18;border:1px solid #1E1F28;border-radius:6px;margin-bottom:6px;font-size:12px;color:#A8A598}
.prod-arr{color:#E8C046;flex-shrink:0}
/* Footer */
.ftr{margin:8px 28px 24px;padding-top:12px;border-top:1px solid #1E1F28;font-size:9px;font-family:'DM Mono',monospace;color:#3A3B44;display:flex;justify-content:space-between}
