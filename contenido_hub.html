  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#0C0D13;color:#E8E7DF;font-family:'DM Sans',sans-serif}
    #root{min-height:100%}
    a{color:inherit;text-decoration:none}
    button{cursor:pointer;font-family:inherit}
    @keyframes wa-shake{0%,85%,100%{transform:none}87%{transform:rotate(-12deg)}89%{transform:rotate(12deg)}91%{transform:rotate(-8deg)}93%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}97%{transform:rotate(0)}}
    .footer-social:hover{background:#E8C046!important;border-color:#E8C046!important}
    .footer-social:hover svg{fill:#04050A!important}
    @media(max-width:600px){
      .hub-controls{width:100%!important;min-width:0!important;align-items:stretch!important}
      .hub-controls .gs-label{text-align:center!important}
    }
    @media(max-width:640px){
      .footer-inner{flex-direction:column!important;align-items:center!important;text-align:center!important}
      .footer-brand{flex-direction:column!important;align-items:center!important;text-align:center!important}
    }
    /* Custom scrollbar — dark theme */
    .mm-scroll::-webkit-scrollbar{width:4px;height:4px}
    .mm-scroll::-webkit-scrollbar-track{background:transparent}
    .mm-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.10);border-radius:4px}
    .mm-scroll::-webkit-scrollbar-thumb:hover{background:rgba(232,192,70,0.35)}
    .mm-scroll{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.10) transparent}
  </style>

eco · tú a cámara directo · energía alta","pantalla":"—","tip":"Abre un loop de expectativa antes del hook principal. El cambio brusco de ritmo mantiene la atención en el momento crítico."},{"label":"HOOK","tiempo":"0:08-0:12","color":"#CF343A","icon":"🎯","audio":"\"Los partidos políticos saben exactamente que sus volantes van a la basura.\"","visual":"Primer plano · sin distracciones · corte limpio","pantalla":"—","tip":"Declaración que nombra un culpable — dispara comentarios de quienes están de acuerdo y de quienes defienden el sistema."},{"label":"OPEN LOOP","tiempo":"0:12-0:16","color":"#E8C046","icon":"👀","audio":"\"Y los mandan igual. ¿Por qué?\"","visual":"Zoom out sutil · Green Screen con imagen de volantes en el suelo","pantalla":"¿Por qué? 👀","tip":"Pregunta sin responder = el espectador no puede irse hasta saber. Es el mecanismo más poderoso de retención en video corto."},{"label":"VILLAIN","tiempo":"0:16-0:22","color":"#CF343A","icon":"🏭","audio":"\"Porque hay un modelo de negocio montado alrededor del papel. Imprentas, distribución, contratos. Moverlo a digital destruye ese negocio. No es ignorancia, es interés.\"","visual":"Quitas GS · primer plano directo","pantalla":"El negocio del papel","tip":"Nombrar al villano específico (imprentas/contratos) genera más comentarios que una crítica genérica. La audiencia lo va a compartir para validar lo que ya sospechaba."},{"label":"REGLA DE ORO","tiempo":"0:22-0:28","color":"#E8C046","icon":"🥇","audio":"\"Los que sí ganan elecciones lo entendieron hace tiempo: la exposición se gana en digital y se afianza en físico. No al revés.\"","visual":"Cambio de ángulo ligero","pantalla":"Regla de oro 🥇","tip":"Contraste claro entre los que ganan y los que pierden. Posiciona a Jairo como quien sabe cuál es el lado correcto."},{"label":"PRUEBA EXTERNA","tiempo":"0:28-0:33","color":"#4A9EE0","icon":"🇺🇸","audio":"\"Obama lo demostró en 2008: construyó una base de 13 millones de contactos digitales antes de mandar a la gente a tocar puertas.\"","visual":"Foto de Obama en campaña 2008 o gráfico de analítica digital","pantalla":"Obama 2008 · 13M contactos","tip":"Autoridad externa + número concreto = credibilidad prestada. El caso Obama es universalmente conocido y no genera debate político propio."},{"label":"PRUEBA PROPIA","tiempo":"0:33-0:41","color":"#199477","icon":"📊","audio":"\"Nosotros lo replicamos en Colombia: elecciones al Congreso, estrategia 100% digital, más de 130.000 contactos reales. Cero papel tirado a la calle.\"","visual":"Número +130.000 en pantalla grande · rostro seguro","pantalla":"+130.000 contactos reales ✅","tip":"El proof point más poderoso del video — número específico, caso real, resultado concreto. Diferencia a Jairo de cualquiera que solo teoriza."},{"label":"CTA POLARIZANTE","tiempo":"0:41-0:47","color":"#7C3AED","icon":"💬","audio":"\"¿Miedo a innovar o negocio que no quieren soltar? Dime en los comentarios — y si conoces a alguien en política, mándale esto.\"","visual":"Primer plano · señalas cámara","pantalla":"¿Miedo o negocio? 💬👇","tip":"Pregunta polarizante que obliga a elegir un lado + pedido explícito de share. Cada comentario alimenta el algoritmo, cada share amplía el alcance."}],"copy":"El mayor fraude del marketing político no es la corrupción.\nEs el volante que todos saben que va a la basura y mandan igual. 💸\n\nNo es ignorancia. Es un modelo de negocio:\nimprentas, distribución, contratos.\nMoverlo a digital destruye ese ecosistema.\nY eso nadie lo quiere admitir.\n\nLos que sí ganan elecciones lo entendieron hace rato:\n📱 La exposición se construye en digital.\n🏘️ Se convierte en físico.\n\nObama lo demostró en 2008 con 13 millones de contactos\nantes de movilizar gente puerta a puerta.\n\nNosotros lo replicamos en Colombia:\nelecciones al Congreso · estrategia 100% digital\n→ +130.000 contactos reales, sin botar papel a las calles.\n\n¿Miedo a innovar o un modelo que no quieren soltar?\nTe leo 👇\n\n📌 Guarda esto si analizas marketing o política.\n\n#MarketingPolitico #EstrategiaDigital #ConsultoriaPolitica\n#DataDriven #CampañasDigitales #MarketingElectoral","produccion":["Miniatura: foto sosteniendo volante arrugado · texto: ¿La política le teme a lo digital?","Música: tono corporativo/tecnológico/documental · volumen muy bajo","Edición: jump cuts en cada cambio de bloque · corte entre pre-hook y hook seco y rápido","Screen de historia: usar el screenshot real de la historia de Instagram — no recrearlo","Post-publicación: responder todos los comentarios en las primeras 2h para impulsar el algoritmo","CTA de share: pedir en comentarios que lo manden a alguien en política → multiplica alcance"]},{"id":"bonos-google","prioridad":2,"titulo":"Google Actualizó sus Bonos y los Subió","formato":"Reel","plataformas":["Instagram","TikTok"],"estado":"Aprobado","duracion":"44s","fecha_grabacion":"2026-06-20","fecha_publicacion":"2026-06-25","objetivo":"Viralidad por utilidad + autoridad Google Partner + leads keyword BONO","blocks":[{"label":"PRE-HOOK","tiempo":"0:00-0:03","color":"#CF343A","icon":"🚨","audio":"\"Google acaba de actualizar su programa de bonos publicitarios y los aumentó.\"","visual":"Tú a cámara · tono de quien trae info importante","pantalla":"Google actualizó 🚨","tip":"Actualizó es noticia — activa el cerebro diferente a una oferta genérica. La palabra noticia hace que el espectador procese esto como información nueva que necesita."},{"label":"CONTEXTO","tiempo":"0:03-0:10","color":"#4A9EE0","icon":"📱","audio":"\"Lo que antes era un solo bono fijo. Ahora hay varias opciones según el país — y los montos nuevos son los más altos que he visto en mis años como Google Partner.\"","visual":"GS: Screenshot del panel Google Partners con las 3 ofertas · señalas la pantalla","pantalla":"Antes: 1 opción → Ahora: más opciones","tip":"Screenshot real del panel Google Partners = credibilidad inmediata. La comparación antes/ahora activa el FOMO en quien ya tenía una cuenta."},{"label":"EL NÚMERO GANCHO","tiempo":"0:10-0:20","color":"#E8C046","icon":"💰","audio":"\"En Colombia los bonos arrancan en $1.680.000 pesos y llegan hasta $5.880.000 en crédito. En Estados Unidos van desde $500 hasta $6.400 dólares. Y el monto varía según el país donde operes.\"","visual":"GS: Zoom animado al número $1.400 y $6.400 del screenshot · dedo señalando cada uno","pantalla":"Colombia: hasta $5.880.000 🇨🇴 · USA: $500-$6.400 USD 🇺🇸","tip":"Zoom al número más alto en el momento exacto que lo dice = retención máxima. Los números específicos (no redondos) son más creíbles y generan más guardados."},{"label":"LA CONDICIÓN","tiempo":"0:20-0:32","color":"#199477","icon":"⏳","audio":"\"Las condiciones también cambiaron — para mejor. Tienes 30 días desde que creas la cuenta para aplicarlo. Y una vez aplicado, tienes 35 días más para que el crédito aparezca en tu cuenta.\"","visual":"GS: Screenshot del aviso de condiciones de Google · luego corte a primer plano","pantalla":"30 días para aplicar ✅ · 35 días para recibirlo ✅","tip":"Presentar las condiciones como mejora invierte la psicología — no es restricción, es ventaja. Decir que cambió para mejor genera sensación de oportunidad."},{"label":"CÓMO SE APLICA","tiempo":"0:32-0:38","color":"#7C3AED","icon":"👆","audio":"\"Y ahora los Partners podemos aplicarlo directamente desde el panel — un clic y queda vinculado a la cuenta del cliente desde el día uno.\"","visual":"GS: Pantalla del botón Aplicar ofertas ahora en Google Partners","pantalla":"Así se aplica 👆","tip":"Mostrar el botón real demuestra acceso exclusivo como Google Partner. La palabra directamente implica que sin Partner es más difícil — posiciona a Jairo como necesario."},{"label":"CTA","tiempo":"0:38-0:44","color":"#CF343A","icon":"💬","audio":"\"Si tienes cuenta nueva o la vas a crear, comenta BONO abajo y te confirmo si aplica para ti.\"","visual":"Primer plano · señalas cámara","pantalla":"Comenta BONO 👇","tip":"Keyword BONO en comentarios = lead calificado (ya dijo que tiene o quiere una cuenta) + señal al algoritmo de Instagram que tiene interacción de alta intención."}],"copy":"Google actualizó su programa de bonos y los aumentó. 🚨\n\nAntes había un solo monto fijo.\nAhora hay varias opciones — y los nuevos son los\nmás altos que recuerdo en años.\n\n🇨🇴 Colombia:\n→ Desde $1.680.000 hasta $5.880.000 pesos\n   en crédito publicitario\n\n🇺🇸 USA:\n→ Desde $500 USD hasta $6.400 USD en crédito publicitario\n\nEl monto varía según el país donde operes.\n\n✅ Y las condiciones mejoraron:\n→ 30 días para aplicarlo desde que creas la cuenta\n→ 35 días para que el crédito aparezca en tu cuenta\n\nComo Google Partner lo aplico directamente en cuentas de clientes.\nAsí arrancamos con presupuesto extra desde el día 1.\n\n¿Tienes cuenta nueva o la vas a crear?\nComenta BONO 👇 y te confirmo si aplica para ti.\n\n📌 Guarda esto — los bonos de junio no duran para siempre.\n\n#GoogleAds #GooglePartner #PublicidadDigital\n#MarketingDigital #NegociosDigitales #GoogleAdsConsejo","produccion":["Miniatura: tú señalando los números en pantalla · texto grande: Google subió sus bonos 🚨","Música: corporativa/tecnológica · volumen muy bajo","GS 0:03-0:10: Screenshot completo panel Google Partners con las 3 ofertas","GS 0:10-0:20: Zoom animado al número $1.400 y $6.400","GS 0:20-0:32: Screenshot del aviso de condiciones","GS 0:32-0:38: Botón Aplicar ofertas ahora en Google Partners","Badge Google Partner en esquina superior durante todo el video","Duración máxima: 44 segundos — no superar","Post-publicación: responder todos los comentarios BONO en las primeras 2h"]}],"jairo_2026-07":[],"jairo_2026-09":[{"id":"estacionalidad-reel","titulo":"La Estacionalidad Afecta tus Campañas y Probablemente No Sabes lo que Es","formato":"Reel","plataformas":["Instagram","TikTok"],"estado":"Publicado","duracion":"60s","fecha_grabacion":"2026-09-05","fecha_publicacion":"2026-09-07","objetivo":"⚡ URGENTE — publicar esta semana · CTA lead magnet 'Comenta GUÍA' · Mundial termina 19 jul","blocks":[{"label":"HOOK-PROMESA","tiempo":"0:00-0:06","color":"#CF343A","icon":"🕐","audio":"\"La estacionalidad afecta tus campañas y probablemente no sabes lo que es. Te lo explico en un minuto.\"","visual":"Tú a cámara · tono de profesor seguro · sin introducción","pantalla":"Estacionalidad 🕐 1 minuto","tip":"La promesa en un minuto crea un contrato. El espectador acepta quedarse ese tiempo exacto."},{"label":"QUÉ ES","tiempo":"0:06-0:18","color":"#4A9EE0","icon":"📖","audio":"\"La estacionalidad es cuando eventos externos cambian el comportamiento de los usuarios en internet. Fechas especiales, temporadas, eventos masivos. Uno de los más grandes que existe está pasando ahora mismo: el Mundial de fútbol.\"","visual":"GS: texto animado con la definición · bold · fondo oscuro","pantalla":"Eventos externos → usuarios cambian","tip":"El espectador aprende que lo que está viviendo tiene nombre. Eso es el primer foco que prende."},{"label":"EL EFECTO","tiempo":"0:18-0:34","color":"#E8C046","icon":"⚖️","audio":"\"Cuando 5.000 millones de personas tienen la cabeza en el fútbol, pasa algo muy específico en la subasta de publicidad digital: más anunciantes compitiendo — más los de pubs, restaurantes, apuestas, telecomunicaciones — y menos usuarios en modo compra en comercio normal porque están pensando en otra cosa: el próximo partido. En conclusión: tu CPA sube aunque no hayas cambiado nada.\"","visual":"Primer plano · tono de diagnóstico · fluido, sin pausar","pantalla":"Más competencia + menos intención = CPA sube ⚖️","tip":"La frase clave: aunque no hayas cambiado nada. Ahí entra el alivio — no es culpa de nadie."},{"label":"LOS NÚMEROS","tiempo":"0:34-0:46","color":"#CF343A","icon":"📊","audio":"\"¿Cuánto? En el Mundial 2022, los CPMs en LATAM subieron entre 15 y 35%. El CTR cayó entre 20 y 40% en ecommerce, educación y servicios. No porque tus campañas se rompieron. Porque el mercado cambió temporalmente. Y esta vez ha habido aumentos superiores al 70% solo en los primeros días.\"","visual":"GS: gráfico simple · barra CPM sube en rojo · CTR baja en naranja","pantalla":"CPMs +35% (2022) · +70% en 2026 🔴","tip":"+70% en 2026 es dato de primera mano que hace el video de esta semana, no histórico."},{"label":"FECHA DE VENCIMIENTO","tiempo":"0:46-0:56","color":"#199477","icon":"🟢","audio":"\"Lo bueno es que tiene fecha de vencimiento: el 19 de julio. Cuando termina el Mundial, la demanda que se reprimió regresa. Las dos semanas post-mundial son históricamente de las mejores del año para campañas de respuesta directa.\"","visual":"Primer plano · tono tranquilizador · decirlo con alivio real","pantalla":"19 de julio → rebote 🟢","tip":"Una fecha concreta vale más que cualquier porcentaje. El 19 de julio es la imagen que se queda."},{"label":"CTA","tiempo":"0:56-1:02","color":"#7C3AED","icon":"💬","audio":"\"¿Tus campañas están sintiendo la estacionalidad este mes? Comenta GUÍA y te envío una guía de cómo identificar la estacionalidad en tus campañas.\"","visual":"Señalas cámara · cierre seco","pantalla":"Comenta GUÍA 👇","tip":"Cada GUÍA en comentarios = lead calificado con campañas activas. Mismo mecanismo que Comenta BONO."}],"copy":"La estacionalidad afecta tus campañas y probablemente no sabes lo que es. 📊\n\nLa estacionalidad es cuando eventos externos cambian el comportamiento de los usuarios.\nUno de los más grandes está pasando ahora: el Mundial de fútbol.\n\nCuando 5.000 millones tienen la cabeza en el fútbol:\n→ Más anunciantes compitiendo (pubs, restaurantes, apuestas, telecomunicaciones)\n→ Menos usuarios en modo compra — están pensando en el próximo partido\n→ Tu CPA sube aunque no hayas cambiado nada\n\n¿Cuánto sube?\n📈 CPMs LATAM 2022: +15% a +35%\n📉 CTR ecommerce/servicios: -20% a -40%\n🔴 2026: +70% en primeros días\n\nLo bueno: tiene fecha de vencimiento.\nEl 19 de julio termina el Mundial.\nLas 2 semanas post-mundial son históricamente de las mejores del año.\n\n¿Tus campañas están sintiendo la estacionalidad?\nComenta GUÍA y te envío cómo identificarla 👇\n\n#GoogleAds #MetaAds #Estacionalidad #Mundial2026 #PublicidadDigital #MarketingLatam","produccion":["⚡ URGENTE — grabar y publicar esta semana · Mundial termina 19 julio","GS definición (0:06): texto animado bold sobre fondo oscuro","GS gráfico (0:34): barra CPM roja + CTR naranja · simple","Miniatura: Estacionalidad 📉 — por qué tus campañas cuestan más este mes","Publicar Reel primero · 24-48h después el Carrusel","Responder cada GUÍA inmediatamente con link del PDF"]},{"id":"estacionalidad-carrusel","titulo":"Por Qué el Mundial Está Arruinando tus Campañas (y Qué Hacer)","formato":"Carrusel","plataformas":["Instagram"],"estado":"Publicado","duracion":"8 slides","fecha_grabacion":"2026-09-06","fecha_publicacion":"2026-09-08","objetivo":"⚡ URGENTE · guardar masivo · mayor potencial de saves del mes · Mundial termina 19 jul","blocks":[{"label":"SLIDE 1 — HOOK","tiempo":"Slide 1","color":"#CF343A","icon":"📉","audio":"\"El Mundial está arruinando tus campañas. Y no es culpa de tu agencia.\"","visual":"Fondo oscuro · texto bold · emoji gráfico bajando","pantalla":"Menos leads · más costo · mismas campañas 📉","tip":"No es culpa de tu agencia genera dos cosas: empresarios que se identifican + agencias que lo comparten para defenderse. Doble audiencia."},{"label":"SLIDE 2 — EL CONTEXTO","tiempo":"Slide 2","color":"#4A9EE0","icon":"🌍","audio":"Mundial 2026: 11 jun–19 jul · 48 equipos · 104 partidos · 5.000 millones de personas · México es sede → disrupción máxima en LATAM","visual":"Mapa con países participantes + número de partidos","pantalla":"5.000M de personas con los ojos en otro lado","tip":"Los datos de contexto dan credibilidad antes de mostrar el impacto en campañas."},{"label":"SLIDE 3 — LOS DATOS","tiempo":"Slide 3","color":"#E8C046","icon":"📊","audio":"CPMs LATAM +15-35% · CTR ecommerce -20-40% · CVR -15-30% · CPL +20-45% · Más afectadas: ecommerce, educación, servicios, inmobiliaria · Menos afectadas: bebidas, telecomunicaciones, deportes","visual":"Tabla con semáforos rojo/amarillo/verde por métrica","pantalla":"Lo que le pasa a tus campañas 📊","tip":"La tabla permite a cada persona identificar si su sector está en la lista roja → saves masivos."},{"label":"SLIDE 4 — EL MECANISMO","tiempo":"Slide 4","color":"#7C3AED","icon":"⚖️","audio":"Más anunciantes (cerveza, snacks, apuestas) compitiendo por la misma pantalla + menos usuarios con intención de compra = tu anuncio más caro y menos efectivo. El algoritmo no sabe que hay Mundial — solo ve que el costo sube y la conversión baja.","visual":"Diagrama balanza: demanda sube · intención baja → CPM sube","pantalla":"Por qué sube aunque no hayas cambiado nada ⚖️","tip":"El por qué convierte el video en educación, no solo información. Diferencia a Jairo de quien solo muestra datos."},{"label":"SLIDE 5 — DÍAS CRÍTICOS","tiempo":"Slide 5","color":"#CF343A","icon":"📅","audio":"Días críticos: partidos de Colombia, México, Argentina, Brasil · Semifinales y Final (15, 18, 19 jul) · Moderado: 3+ partidos simultáneos · días post-eliminación local · Normal o mejor: días sin equipos LATAM","visual":"Mini calendario de julio con días marcados rojo/amarillo/verde","pantalla":"Los peores días para tus campañas 📅","tip":"El calendario es el elemento más guardado del carrusel. La gente lo guarda de referencia durante el torneo."},{"label":"SLIDE 6 — EL ERROR FATAL","tiempo":"Slide 6","color":"#CF343A","icon":"❌","audio":"Lo que hace el 90% cuando ve el CPA subir: llama en pánico · pide cambiar las campañas · pausa lo que funcionaba · lanza sin datos · baja presupuesto. Resultado: cuando el Mundial termine, la campaña está en fase de aprendizaje. Perdiste el rebote.","visual":"Lista de errores en rojo · fondo oscuro · alto contraste","pantalla":"El error del 90% de los anunciantes ❌","tip":"El 90% genera identificación. El que lo está haciendo se detiene. El que no, lo manda a su agencia."},{"label":"SLIDE 7 — EL PLAN","tiempo":"Slide 7","color":"#199477","icon a","Música: corporativa · sube en la creatividad ES la segmentación","Máximo 44s"]},{"id":"tiktok-agentica","prioridad":7,"titulo":"TikTok Acaba de Hacer las Campañas Opcionales Para los Humanos","formato":"Reel","plataformas":["Instagram","TikTok"],"estado":"En revisión","duracion":"45s","fecha_grabacion":"2026-09-22","fecha_publicacion":"2026-09-24","objetivo":"Debate existencial para media buyers · expectativa del curso TikTok Ads","blocks":[{"label":"PRE-HOOK","tiempo":"0:00-0:04","color":"#7C3AED","icon":"👀","audio":"\"TikTok acaba de anunciar algo que debería asustar a cualquier media buyer.\"","visual":"Tú a cámara · tono de quien trae info importante · sin GS","pantalla":"👀","tip":"La expectativa antes de la revelación. La palabra asustar es intencional — activa la amígdala del espectador y garantiza que se queda a escuchar."},{"label":"LA NOTICIA","tiempo":"0:04-0:14","color":"#CF343A","icon":"🚨","audio":"\"En mayo 2026, TikTok presentó su MCP Server: una infraestructura abierta para que agentes de IA gestionen campañas de forma autónoma. La intervención humana en publicidad pasa a ser opcional.\"","visual":"GS: pantalla del TikTok World o anuncio oficial del MCP Server","pantalla":"TikTok MCP Server · mayo 2026","tip":"La fecha específica (mayo 2026) hace la noticia verificable y creíble. La frase intervención humana pasa a ser opcional es el gancho emocional más fuerte del video."},{"label":"LO QUE SIGNIFICA","tiempo":"0:14-0:26","color":"#E8C046","icon":"🤖","audio":"\"Un agente de IA puede crear la campaña, optimizar las pujas, pausar los anuncios que no convierten y escalar los que sí — sin que nadie lo toque. Esto no es el futuro. Pasó hace 6 semanas.\"","visual":"Primer plano · pausa dramática antes de hablar la última frase","pantalla":"IA gestionando campañas sola · ya ocurrió","tip":"El tiempo verbal pasado (pasó hace 6 semanas) hace la afirmación más impactante que el futuro. Ya es realidad, no predicción."},{"label":"EL VILLANO","tiempo":"0:26-0:35","color":"#CF343A","icon":"🏭","audio":"\"Las agencias que cobran por gestión manual de cuentas tienen un problema serio. Porque dentro de 12 meses, lo que ellas hacen en una semana, una IA lo va a hacer en 10 minutos.\"","visual":"Gestos con las manos · tono de análisis · no de ataque","pantalla":"El modelo de negocio de las agencias 🏭","tip":"Nombrar el villain (agencias que cobran por gestión manual) genera comentarios de defensa y de acuerdo. La comparación semana vs 10 minutos es la imagen más memorable del video."},{"label":"EL BRIDGE","tiempo":"0:35-0:41","color":"#199477","icon":"🧭","audio":"\"Pero aquí está la clave: la IA todavía necesita que alguien sepa dirigirla. El media buyer que entiende cómo funciona la IA por dentro es el que va a sobrevivir y crecer.\"","visual":"Primer plano · tono seguro · reencuadra el mensaje","pantalla":"Quien dirige la IA, gana","tip":"El reencuadre positivo después del villain es necesario — sin él el video genera solo miedo. La frase quien entiende la IA por dentro es el gancho para el curso de TikTok Ads."},{"label":"CTA","tiempo":"0:41-0:45","color":"#7C3AED","icon":"💬","audio":"\"¿El media buyer humano tiene futuro o ya lo estamos viendo morir? Dime en los comentarios.\"","visual":"Señalas cámara · directo","pantalla":"¿Futuro o extinción? 👇","tip":"Pregunta existencial que nadie puede ignorar. Todo media buyer en la audiencia de Jairo tiene una opinión sobre esto — y va a expresarla en comentarios."}],"copy":"TikTok acaba de hacer la intervención humana en publicidad… opcional. 👀\n\nEn mayo 2026 presentaron el TikTok Ads MCP Server:\n→ Infraestructura abierta para agentes de IA\n→ La IA puede crear campañas, optimizar pujas, pausar y escalar sola\n→ Sin que nadie la toque\n\nEsto no es el futuro.\nPasó hace 6 semanas.\n\nLas agencias que cobran por \"gestión manual de cuentas\" tienen un problema serio.\nLo que ellas hacen en una semana, una IA lo va a hacer en 10 minutos.\n\nPero aquí está la clave:\nLa IA todavía necesita que alguien sepa dirigirla.\nEl media buyer que entiende cómo funciona por dentro es el que va a sobrevivir.\n\nEl que no lo entienda... es el que la IA va a reemplazar.\n\n¿El media buyer humano tiene futuro o ya lo estamos viendo morir?\nDime en los comentarios 👇\n\n#TikTokAds #MediaBuyer #IA #InteligenciaArtificial #MarketingDigital #FuturoDelMarketing","produccion":["GS: pantalla de TikTok World o anuncio oficial del MCP Server","La pregunta del CTA es intencionalmente provocadora — no suavizarla — genera debate masivo","Miniatura: tú con cara de alerta · texto TikTok acaba de hacer a los media buyers opcionales","Música: tecnológica · algo que suene a futuro","Máximo 45s · publicar primero en IG, luego en TikTok orgánico"]},{"id":"pmax-error","prioridad":8,"titulo":"El 90% de los P-Max Están Mal Configurados","formato":"Reel","plataformas":["Instagram","TikTok"],"estado":"En revisión","duracion":"44s","fecha_grabacion":"2026-09-23","fecha_publicacion":"2026-09-25","objetivo":"Opinión fuerte · posicionar a Jairo como el que audita lo que otros lanzan mal","blocks":[{"label":"PRE-HOOK","tiempo":"0:00-0:04","color":"#CF343A","icon":"💸","audio":"\"El error más caro que veo en Google Ads no es el presupuesto. Es lanzar P-Max sin estar listos.\"","visual":"Tú a cámara · tono seguro · de quien ha visto esto cientos de veces","pantalla":"El error más caro 💸","tip":"Abre con el error antes de explicarlo — genera curiosidad. La frase no es el presupuesto invierte la expectativa de la audiencia que esperaba otro tipo de error."},{"label":"EL DATO","tiempo":"0:04-0:12","color":"#E8C046","icon":"📊","audio":"\"En las auditorías que hago, el 90% de los P-Max que reviso están mal configurados. No porque la campaña sea mala — sino porque la lanzaron demasiado pronto.\"","visual":"GS: pantalla de P-Max en Google Ads · señalas la campaña","pantalla":"90% mal configurados 📊","tip":"El porcentaje concreto (90%) hace la afirmación medible y provocadora. La razón (demasiado pronto, no la campaña) desmonta la defensa antes de que aparezca."},{"label":"POR QUÉ FALLA","tiempo":"0:12-0:24","color":"#4A9EE0","icon":"🔢","audio":"\"P-Max necesita mínimo 50 conversiones al mes para que el algoritmo optimice bien. Sin esas señales, la IA no sabe a quién mostrarle el anuncio y el presupuesto se va en impresiones que no convierten. La mayoría lo lanza el día 1, con cuenta nueva, sin historial.\"","visual":"Primer plano · explica con los dedos contando · 1-2-3","pantalla":"50 conv/mes mínimo · sin historial = dinero perdido","tip":"El número específico (50 conversiones/mes) hace el error tangible y verificable. La imagen del presupuesto yéndose en impresiones que no convierten es la más impactante para el espectador con dinero invertido."},{"label":"EL VILLANO","tiempo":"0:24-0:33","color":"#CF343A","icon":"🏭","audio":"\"Y el problema es que las agencias lo presentan como la solución mágica. Lanzamos P-Max y el algoritmo hace todo el trabajo. Sí — pero el algoritmo necesita datos para trabajar. Sin datos, trabaja para nada.\"","visual":"Primer plano · directo · sin gestos exagerados","pantalla":"P-Max no es magia 🪄","tip":"Nombrar la promesa falsa de las agencias (solución mágica) genera debate. Quienes la han escuchado se identifican, quienes la han dicho se defienden."},{"label":"LA SOLUCIÓN","tiempo":"0:33-0:40","color":"#199477","icon":"✅","audio":"\"La secuencia correcta: Search primero, 30 conversiones, luego tCPA, 50 conversiones — ahí lanzas P-Max. Con señales reales.\"","visual":"GS: diagrama visual de la secuencia correcta en 4 pasos","pantalla":"Search → 30 conv → tCPA → 50 conv → P-Max ✅","tip":"La solución visual en 4 pasos es lo que más se guarda del video. El diagrama debe verse simple y claro — es la hoja de ruta que la gente busca."},{"label":"CTA","tiempo":"0:40-0:44","color":"#CF343A","icon":"💬","audio":"\"¿Tienes P-Max activo? Dime cuántas conversiones al mes tiene tu cuenta.\"","visual":"Señalas cámara","pantalla":"¿Cuántas conversiones? 👇","tip":"Pregunta que revela el estado real de la cuenta del espectador. Quien responde ya dijo si su P-Max tiene las señales necesarias o no."}],"copy":"El error más caro en Google Ads no es el presupuesto.\nEs lanzar P-Max sin estar listos. 💸\n\nEn las auditorías que hago, el 90% de los P-Max que reviso están mal configurados.\n\nNo porque la campaña sea mala.\nPorque la lanzaron demasiado pronto.\n\nP-Max necesita mínimo 50 conversiones/mes para optimizar bien.\nSin esas señales, la IA no sabe a quién mostrarle el anuncio.\nY el presupuesto se va en impresiones que no convierten.\n\nEl problema: las agencias lo venden como magia.\n\"Lanzamos P-Max y el algoritmo hace todo.\"\n\nSí — pero el algoritmo necesita datos para trabajar.\nSin datos, trabaja para nada.\n\nLa secuencia correcta:\n1️⃣ Search manual CPC primero\n2️⃣ Acumula 30 conversiones → activa tCPA\n3️⃣ Llega a 50 conv/mes → lanza P-Max con señales reales\n\n¿Tienes P-Max activo?\nDime cuántas conversiones al mes tiene tu cuenta 👇\n\n#GoogleAds #PMax #PerformanceMax #MarketingDigital #GooglePartner #PublicidadDigital","produccion":["GS: pantalla real de P-Max en Google Ads + diagrama de la secuencia correcta","Miniatura: texto P-Max sin señales = dinero a la basura · tono de alerta","El número 90% en pantalla grande cuando lo menciona","El diagrama de secuencia (0:33) debe ser claro y simple — 4 pasos visuales","Máximo 44s"]},{"id":"stack-ia","prioridad":9,"titulo":"El Stack de IA para Manejar Cuentas 3x Más Rápido","formato":"Carrusel","plataformas":["Instagram"],"estado":"En revisión","duracion":"8 slides","fecha_grabacion":"2026-09-24","fecha_publicacion":"2026-09-26","objetivo":"Guardar masivo entre marketers · mayor tasa de saves del mes","blocks":[{"label":"SLIDE 1 — HOOK","tiempo":"Slide 1","color":"#4A9EE0","icon":"🚀","audio":"Antes me tomaba 3 horas optimizar una cuenta de Google Ads. Ahora lo hago en 1. Estas son las herramientas.","visual":"Fondo oscuro · tipografía bold · reloj +  5 — SIMPHONY","tiempo":"Slide 5","color":"#7C3AED","icon":"🎵","audio":"Simphony de TikTok: asistente de IA que corrige y optimiza videos activos directamente en Ads Manager. Analiza el hook rate, el completion rate y sugiere cambios específicos. Directo en la plataforma.","visual":"Logo TikTok + Simphony · bullets con métricas que analiza","pantalla":"Simphony · optimiza videos activos","tip":"La herramienta más desconocida del stack = el mayor valor del carrusel. La mayoría no sabe que existe — genera guardar masivo entre los que manejan TikTok Ads."},{"label":"SLIDE 6 — PERPLEXITY","tiempo":"Slide 6","color":"#CF343A","icon":"🔍","audio":"Perplexity para auditar competidores, entender el mercado y buscar benchmarks de la industria en tiempo real. Más rápido que Google para preguntas de investigación de marketing. Gratuito.","visual":"Logo Perplexity · bullets de casos de uso","pantalla":"Perplexity · investigación en tiempo real · gratis","tip":"Mencionar que es gratuito elimina la barrera de entrada. La comparación más rápido que Google para preguntas de marketing es la frase más citada."},{"label":"SLIDE 7 — LA REGLA","tiempo":"Slide 7","color":"#E8C046","icon":"💡","audio":"La IA no te reemplaza. Te multiplica. El media buyer que usa estas herramientas hace el trabajo de 3 personas. El que no las usa, compite con alguien que las tiene. En 2026 no se trata de si usar IA — se trata de qué tan bien sabes usarla.","visual":"Solo texto bold en fondo oscuro · sin íconos · máximo impacto visual","pantalla":"La IA te multiplica. No te reemplaza.","tip":"Solo texto = máximo impacto visual en este slide. La frase La IA no te reemplaza. Te multiplica. es el insight más compartido del carrusel — resuelve el miedo de la audiencia."},{"label":"SLIDE 8 — CTA","tiempo":"Slide 8","color":"#199477","icon":"💬","audio":"¿Cuál de estas herramientas ya estás usando? Dime en los comentarios cuál ya tienes en tu stack y cuál te falta.","visual":"CTA claro · fondo de marca · instrucción de guardar visible","pantalla":"Guarda 📌 y dime cuál usas 👇","tip":"CTA doble: guardar + comentar = máximo engagement. La pregunta cuál te falta genera respuestas que muestran el gap de la audiencia — información útil para futuros contenidos."}],"copy":"Antes me tomaba 3 horas optimizar una cuenta de Google Ads.\nAhora lo hago en 1. 🚀\n\nEstas son las 5 herramientas de IA que cambió cómo manejo cuentas:\n\n1. ChatGPT — 30 variaciones de copy RSA en 2 minutos\n2. Asset Studio (Gemini) — creatividades consistentes en Google Ads\n3. Agente Unificado Google — analiza Ads + Analytics + MC en lenguaje natural\n4. Simphony (TikTok) — optimiza videos activos directamente en Ads Manager\n5. Perplexity — investigación de mercado y benchmarks en tiempo real\n\nDesliza para ver cómo uso cada una 👉\n\nLa regla que me cambió la perspectiva:\nLa IA no te reemplaza.\nTe multiplica.\n\nEl media buyer que usa estas herramientas hace el trabajo de 3 personas.\nEl que no las usa, compite con alguien que sí las tiene.\n\n¿Cuál de estas ya tienes en tu stack?\nDime en los comentarios cuál te falta 👇\n\n📌 Guarda esto — las herramientas van a seguir evolucionando.\n\n#IA #InteligenciaArtificial #GoogleAds #MarketingDigital #MediaBuyer #HerramientasMarketing","produccion":["Diseño en Canva · ratio 4:5 · fondo oscuro consistente con estética de Jairo","Cada slide = una herramienta + logo oficial + 2-3 bullets concretos","Slide 7 (la regla) debe ser la más impactante — solo texto, sin íconos","No incluir herramientas de pago sin aclarar que son gratuitas o de pago","Publicar este carrusel con el mayor engagement esperado del mes"]},{"id":"chatgpt-ads-update","titulo":"Actualización ChatGPT Ads: Ya Puedes Medir Conversiones","formato":"Reel","plataformas":["Instagram","TikTok"],"estado":"En revisión","duracion":"45s","fecha_grabacion":"2026-09-10","fecha_publicacion":"2026-09-12","objetivo":"Continuación del carrusel · actualización de pixel de conversiones + Android/iOS próximamente","blocks":[{"label":"HOOK","tiempo":"0:00-0:05","color":"#E8C046","icon":"📡","audio":"\"ChatGPT Ads acaba de lanzar algo que cambia el juego para los que ya están dentro.\"","visual":"Tú a cámara · tono de quien trae una actualización importante","pantalla":"ChatGPT Ads se actualizó 📡","tip":"Acaba de lanzar crea urgencia inmediata. Los que vieron el carrusel anterior se quedan porque ya están contextualizados."},{"label":"LA NOVEDAD","tiempo":"0:05-0:18","color":"#199477","icon":"🆕","audio":"\"Ya puedes agregar un medio de datos para conversiones. Eso significa que ya hay pixel en ChatGPT Ads. Aún no puedes crear campañas enfocadas en conversiones — pero ya puedes instalarlo y empezar a acumular datos desde hoy.\"","visual":"GS: screenshot real de la sección de fuente de datos de conversiones en ChatGPT Ads","pantalla":"Ya hay pixel ✅ · Campañas de conversión: próximamente","tip":"La distinción entre ya hay pixel y aún no hay campañas de conversión es la información que nadie está comunicando con claridad en español."},{"label":"LO QUE VIENE","tiempo":"0:18-0:32","color":"#7C3AED","icon":"🔜","audio":"\"Y lo que viene es aún más interesante: se espera una integración específica de pixel para Android e iOS. Una integración nativa de app tracking dentro de ChatGPT Ads. Eso lo cambia todo para quienes tienen apps. Es algo que esperamos probar muy pronto.\"","visual":"Primer plano · tono de quien tiene información de primera mano · genuino","pantalla":"Android e iOS 🔜 · Integración nativa de app tracking","tip":"El genuino esperamos probar muy pronto es prueba de que MatixMedia está activo en la plataforma. No es información de blog — es de primera mano."},{"label":"POR QUÉ IMPORTA","tiempo":"0:32-0:40","color":"#4A9EE0","icon":"📊","audio":"\"Si tienes acceso ahora en México o Brasil, o si llegas el día 1 en Colombia: instalar el pixel hoy te va a dar ventaja real cuando las campañas de conversión se activen. Los datos acumulados van a ser tu diferencial.\"","visual":"GS: diagrama simple — instalar pixel hoy → datos acumulados → ventaja el día 1","pantalla":"Instala el pixel hoy → ventaja el día 1 📊","tip":"El argumento de datos acumulados = ventaja futura convierte una limitación actual en una razón para actuar ya."},{"label":"CTA","tiempo":"0:40-0:45","color":"#CF343A","icon":"💬","audio":"\"¿Ya instalaste el pixel de ChatGPT Ads? Dime en los comentarios en qué país estás.\"","visual":"Señalas cámara · cierre directo","pantalla":"¿Ya lo instalaste? 👇","tip":"La pregunta revela quién ya tiene acceso. Jairo puede responder a cada uno con recomendaciones específicas por país."}],"copy":"ChatGPT Ads acaba de actualizarse. 📡\n\nLa novedad:\n✅ Ya puedes agregar un pixel de conversiones\n\nLo que significa:\n→ Ya puedes instalar el pixel y acumular datos\n→ Campañas de conversión: no disponibles todavía\n→ Pero los datos que acumules hoy serán tu ventaja cuando lleguen\n\nY lo que viene es aún más interesante:\n🔜 Integración específica de pixel para Android e iOS\nTracking nativo de apps dentro de ChatGPT Ads.\nAlgo que esperamos probar muy pronto.\n\nSi tienes acceso en México o Brasil, o llegas el día 1 en Colombia:\nInstala el pixel hoy.\nLos datos acumulados van a ser tu diferencial.\n\n¿Ya instalaste el pixel de ChatGPT Ads?\nDime en los comentarios en qué país estás 👇\n\n#ChatGPTAds #PublicidadDigital #IA #OpenAI #MarketingLatam #Pixel","produccion":["GS La novedad (0:05): screenshot real de la sección fuente de datos de conversiones","GS Por qué importa (0:32): diagrama simple pixel → datos → ventaja","Miniatura: ChatGPT Ads tiene pixel 📡 — actualización","Publicar como continuación del carrusel · mencionar en la descripción el carrusel anterior","Máximo 45s"]},{"id":"reels-vs-carrusel","prioridad":5,"titulo":"Para de Publicar Solo Reels","formato":"Carrusel","plataformas":["Instagram"],"estado":"En revisión","duracion":"8 slides","fecha_grabacion":"2026-09-19","fecha_publicacion":"2026-09-21","objetivo":"Guardar masivo entre marketers · educación sobre cuándo usar cada formato","blocks":[{"label":"SLIDE 1 — HOOK","tiempo":"Slide 1","color":"#E8C046","icon":"🎯","audio":"El formato que más guardados genera en IG en 2026 no es el Reel.","visual":"Fondo oscuro · texto grande · emoji de sorpresa · tipografía bold","pantalla":"No es el Reel 👀","tip":"La afirmación contraintuitiva que obliga a deslizar. Quien cree que los Reels son lo único que funciona necesita saber por qué está equivocado."},{"label":"SLIDE 2 — EL MITO","tiempo":"Slide 2","color":"#CF343A","icon":"❌","audio":"Todos dicen que los Reels son lo único que funciona. Pero hay algo que el Reel no puede hacer que el carrusel sí. El Reel te da alcance. El carrusel te da atención profunda.","visual":"Dos columnas: Reel = alcance vs Carrusel = atención profunda","pantalla":"Reel = alcance · Carrusel = profundidad","tip":"El contraste claro en dos columnas hace que el concepto sea inmediatamente comprensible. No son formatos en competencia, son herramientas diferentes."},{"label":"SLIDE 3 — POR QUÉ","tiempo":"Slide 3","color":"#4A9EE0","icon":"🧠","audio":"Cuando alguien desliza un carrusel, el algoritmo lo interpreta como señal de alta intención. Cada swipe es más tiempo en tu contenido, más distribución. Los guardados en carrusel son 3 veces más frecuentes que en Reels educativos.","visual":"Ícono de dedo deslizando · diagrama simple de swipe → tiempo → distribución","pantalla":"Cada swipe = señal al algoritmo","tip":"El mecanismo técnico (swipe = señal de intención) explica por qué funciona. El dato 3x más guardados es lo que más se cita en comentarios."},{"label":"SLIDE 4 — CUÁNDO REEL","tiempo":"Slide 4","color":"#199477","icon":"✅","audio":"Usa Reels cuando quieres alcance masivo a audiencias nuevas, tienes un hook visual fuerte, la novedad o tendencia es el gancho, o el mensaje cabe en menos de 45 segundos.","visual":"Lista con checks verdes · fondo verde suave","pantalla":"Cuándo usar Reels ✅","tip":"La guía práctica que la gente guarda. Cuatro criterios concretos que eliminan la duda de cuándo usar Reels."},{"label":"SLIDE 5 — CUÁNDO CARRUSEL","tiempo":"Slide 5","color":"#199477","icon":"✅","audio":"Usa Carruseles cuando quieres que te guarden y vuelvan, tienes una lista, proceso o comparación, el contenido necesita más de una pantalla para entenderse, o quieres enseñar algo paso a paso.","visual":"Lista con checks verdes · fondo verde suave","pantalla":"Cuándo usar Carrusel ✅","tip":"La guía práctica complementaria. El criterio de más de una pantalla es el más compartido porque resuelve la duda más frecuente."},{"label":"SLIDE 6 — LA ESTRATEGIA","tiempo":"Slide 6","color":"#7C3AED","icon":"🔗","audio":"Los dos juntos ganan. Reel como gancho, Carrusel como conversión. Publica el Reel primero para alcance masivo. Si el tema funciona, hazlo carrusel — los seguidores que llegaron del Reel lo guardan y lo comparten.","visual":"Diagrama: Reel → Carrusel · flujo visual de la estrategia","pantalla":"Reel → Carrusel = la estrategia ganadora","tip":"La síntesis que da el insight de todo el carrusel. El diagrama Reel → Carrusel es la imagen que más se guarda y se cita."},{"label":"SLIDE 7 — SPECS 2026","tiempo":"Slide 7","color":"#E8C046","icon":"📐","audio":"Especificaciones actualizadas: Reels, formato 9 por 16, 1080 por 1920 píxeles, máximo 90 segundos pero el óptimo es entre 15 y 45 segundos. Carrusel: hasta 20 slides, formato 4 por 5 de 1080 por 1350 píxeles recomendado, y la primera slide es la portada — la más importante.","visual":"Tabla limpia con specs técnicos · dos columnas: Reels y Carrusel","pantalla":"Specs actualizados 2026","tip":"El dato técnico que hace guardar el carrusel. Los specs concretos son lo que más buscan los creadores antes de producir contenido."},{"label":"SLIDE 8 — CTA","tiempo":"Slide 8","color":"#CF343A","icon":"💬","audio":"Guarda este carrusel para tenerlo de referencia. Y dime en los comentarios qué formato está generando más engagement en tu cuenta.","visual":"Fondo de marca · CTA claro · instrucción de guardar visible","pantalla":"Guarda 📌 y dime 👇","tip":"CTA doble: guardar + comentar = máximo engagement. La pregunta sobre qué formato les funciona genera respuestas útiles para Jairo también."}],"copy":"Para de publicar solo Reels. 🛑\n\nEl formato que más guardados genera en IG en 2026 no es el Reel — es el carrusel bien hecho.\n\nY no, no son lo mismo:\n📱 Reel = alcance masivo, atención corta\n📋 Carrusel = menos alcance, engagement profundo\n\nLa estrategia que funciona en 2026:\n→ Usa el Reel para que te descubran\n→ Usa el carrusel para que se queden\n\nDesliza para ver cuándo usar cada uno 👉\n\n¿Cuál te está funcionando mejor?\nDime en los comentarios 👇\n\n📌 Guarda esto para tenerlo de referencia.\n\n#MarketingDigital #InstagramMarketing #ContentStrategy #ReelsvsCarrusel #MarketingLatam","produccion":["Diseñar en Canva con brand kit de Jairo (cuando esté listo)","Primera slide = hook visual bold — es lo que decide si desliza o no","Cada slide debe tener un solo concepto — no sobrecargar texto","Ratio 4:5 (1080x1350px) para mayor presencia en feed"]}]},"rev":2};function bs(t){if(!t)return null;let l=new Date;return l.setHours(0,0,0,0),Math.round((new Date(t+"T00:00:00")-l)/864e5)}function M1(t,l){if(l==="Publicado"||l==="En producci\xF3n")return null;let e=bs(t);return e===null?null:e<0?{color:"#CF343A",bg:"rgba(207,52,58,.2)",icon:"\u{1F534}",label:"Grabar: Vencido",nivel:3}:e===0?{color:"#CF343A",bg:"rgba(207,52,58,.15)",icon:"\u{1F534}",label:"Grabar: Hoy",nivel:3}:e<=2?{color:"#E8C046",bg:"rgba(232,192,70,.15)",icon:"\u{1F7E1}",label:"Grabar: "+(e===1?"Ma\xF1ana":"En "+e+" d\xEDas"),nivel:2}:e<=5?{color:"#E8C046",bg:"rgba(232,192,70,.1)",icon:"\u{1F7E1}",label:"Grabar: En "+e+" d\xEDas",nivel:1}:null}function E1(t,l){if(l==="Publicado")return null;let e=bs(t);return e===null?null:e<0?{color:"#CF343A",bg:"rgba(207,52,58,.2)",icon:"\u{1F534}",label:"Publicar: Vencido",nivel:3}:e===0?{color:"#CF343A",bg:"rgba(207,52,58,.15)",icon <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0C0D13;color:#E8E7DF;font-family:'DM Sans',sans-serif;min-height:100%}
@media print{html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
/* Navbar \u2014 igual al hub */
.nav{display:flex;align-items:center;gap:10px;padding:14px 28px;background:rgba(12,13,19,0.97);border-bottom:1px solid rgba(255,255,255,0.07);margin-bottom:0}
.nav-logo{width:32px;height:32px;border-radius:50%;border:2px solid #E8C046;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#14151C}
.nav-logo img{width:100%;height:100%;object-fit:contain;padding:2px}
.nav-brand{font-size:13px;color:#E8C046;font-weight:400;letter-spacing:.02em}
.nav-sep{color:#3A3B44;font-size:13px;margin:0 2px}
.nav-sub{font-size:13px;color:#A8A598}
/* Card t\xEDtulo \u2014 como el header del popup */
.card-hdr{background:rgba(18,19,28,0.9);border-bottom:1px solid rgba(255,255,255,0.06);padding:18px 28px}
.card-title{font-size:18px;font-weight:600;color:#FDFCF7;margin-bottom:8px;line-height:1.25;letter-spacing:-.01em}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag-c{font-size:10px;font-family:'DM Mono',monospace;color:#E8C046;padding:2px 8px;border-radius:4px;background:rgba(232,192,70,0.10)}
.tag-m{font-size:10px;font-family:'DM Mono',monospace;color:#A8A598}
.tag-e{font-size:10px;font-family:'DM Mono',monospace;padding:1px 7px;border-radius:4px}
.dot{color:#2A2B34;font-size:11px}
/* Body del popup */
.body{padding:20px 28px;display:flex;flex-direction:column;gap:18px}
/* Chips meta */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-fmt{font-size:10px;font-family:'DM Mono',monospace;color:#A8A598;padding:2px 9px;border-radius:4px;background:#14151C;border:1px solid #1E1F28}
.chip-plt{font-size:10px;font-family:'DM Mono',monospace;color:#5A5A52;padding:2px 0}
.chip-date-g{font-size:10px;font-family:'DM Mono',monospace;color:#4A9EE0;padding:2px 9px;border-radius:4px;background:rgba(74,158,224,0.08)}
.chip-date-p{font-size:10px;font-family:'DM Mono',monospace;color:#7C3AED;padding:2px 9px;border-radius:4px;background:rgba(124,58,237,0.08)}
/* Objetivo */
.obj{font-size:11px;font-family:'DM Mono',monospace;color:#5A5A52;line-height:1.6}
/* Section label */
.sec-lbl{font-size:9px;font-family:'DM Mono',monospace;color:#3A3B44;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
/* Copy */
.copy-txt{font-size:12px;color:#A8A598;line-height:1.7;white-space:pre-wrap;font-family:'DM Sans',sans-serif}
/* Bloques guion */
.blk{background:#0E0F18;border:1px solid #1E1F28;border-radius:8px;padding:12px 14px;margin-bottom:8px;page-break-inside:avoid}
.blk-num{font-size:9px;font-family:'DM Mono',monospace;color:#E8C046;opacity:.7;margin-bottom:7px}
.blk-row{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.blk-ico{font-size:11px;flex-shrink:0;margin-top:1px}
.blk-lbl{font-size:9px;font-family:'DM Mono',monospace;color:#3A3B44;flex-shrink:0;width:52px;padding-top:1px}
.blk-val{font-size:12px;color:#FDFCF7;line-height:1.6}
.blk-val-dim{font-size:12px;color:#A8A598;line-height:1.6}
.blk-val-muted{font-size:12px;color:#5A5A52;line-height:1.6;font-style:italic}
/* Producci\xF3n */
.prod-item{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;background:#0E0F18;border:1px solid #1E1F28;border-radius:6px;margin-bottom:6px;font-size:12px;color:#A8A598}
.prod-arr{color:#E8C046;flex-shrink:0}
/* Footer */
.ftr{margin:8px 28px 24px;padding-top:12px;border-top:1px solid #1E1F28;font-size:9px;font-family:'DM Mono',monospace;color:#3A3B44;display:flex;justify-content:space-between}
</style></head><body>
<div class="nav">
  <div class="nav-logo"><img src="${c}" alt="MatixMedia"/></div>
  <span class="nav-brand">MatixMedia</span>
  <span class="nav-sep">\xB7</span>
  <span class="nav-sub">Hub de Contenido</span>
</div>

</div>
<div class="body">
  <div class="chips">
